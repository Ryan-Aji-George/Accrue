  --f:'Geist',-apple-system,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
}
#app.fs{--top:calc(var(--sbh) + 12px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overscroll-behavior:none}
body{font-family:var(--f);color:var(--t1);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"tnum" 1,"cv11" 1;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.3;pointer-events:none}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ============ Shell ============ */
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:600px){
  #app{left:50%;top:50%;right:auto;bottom:auto;width:412px;height:min(915px,calc(100vh - 32px));transform:translate(-50%,-50%);border-radius:44px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 100px rgba(0,0,0,.8)}
}

/* ============ Status bar + notifications ============ */
.sbar{position:absolute;left:0;right:0;top:0;z-index:40;height:var(--top);padding:0 22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;background:linear-gradient(to bottom,var(--bg) 0%,var(--bg) 55%,rgba(9,9,11,0) 100%)}
.sb-side{height:var(--sbh);display:flex;align-items:center;font-size:14px;font-weight:600;letter-spacing:-.01em;min-width:56px;visibility:hidden}
#app.fs .sb-side{visibility:visible}
.sb-batt{justify-content:flex-end;gap:6px;font-size:12.5px;color:var(--t2);font-weight:500}
.batt{width:24px;height:12px;border:1.5px solid rgba(255,255,255,.35);border-radius:4px;position:relative;padding:1.5px}
.batt::after{content:"";position:absolute;right:-4.5px;top:2.5px;width:2px;height:4px;background:rgba(255,255,255,.35);border-radius:0 2px 2px 0}
.batt i{display:block;height:100%;background:var(--t1);border-radius:1.5px}
.batt.low i{background:var(--neg)}.batt.ch i{background:var(--pos)}
.note{position:absolute;z-index:400;left:10px;right:10px;top:calc(var(--top) - 8px);max-width:420px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px 15px 11px 11px;border-radius:20px;background:rgba(33,33,37,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);box-shadow:0 16px 40px -12px rgba(0,0,0,.8);transform:translateY(calc(-100% - var(--top)));opacity:0;transition:transform .5s var(--soft),opacity .3s;cursor:pointer;pointer-events:none}
.note.show{transform:none;opacity:1;pointer-events:auto}
.nt-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--lcg);color:var(--lc);font-size:17px;flex:none}
.nt-tx{flex:1;min-width:0}
.nt-1{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-2{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-a{font-size:15px;font-weight:600;color:var(--lc);white-space:nowrap}
.wave{display:inline-flex;align-items:center;gap:2px;height:11px}
.wave i{width:2.5px;height:100%;border-radius:2px;background:var(--ac);animation:wave 1.2s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:-.3s}.wave i:nth-child(3){animation-delay:-.6s}.wave i:nth-child(4){animation-delay:-.9s}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

/* ============ Views ============ */
.views{position:absolute;inset:0;z-index:2}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;
  padding:calc(var(--top) + 8px) 16px calc(var(--dock-h) + var(--safe-b) + 44px);
  opacity:0;visibility:hidden;transform:translateX(18px);transition:opacity .25s var(--ease),transform .45s var(--ease),visibility 0s .45s}
.view::-webkit-scrollbar{display:none}
.view.left{transform:translateX(-18px)}
.view.active{opacity:1;visibility:visible;transform:none;transition:opacity .4s var(--ease),transform .55s var(--soft),visibility 0s}
.view.active .rise{animation:rise .6s var(--soft) both;animation-delay:calc(var(--i,0) * 45ms + 20ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}

/* header */
.hdr{display:flex;align-items:center;gap:12px;margin:2px 2px 16px}
.me{width:44px;height:44px;border-radius:50%;position:relative;flex:none;display:grid;place-items:center;font-weight:600;font-size:15px;transition:transform .3s var(--spring)}
.me:active{transform:scale(.92)}
.me svg{position:absolute;inset:0;transform:rotate(-90deg)}
.me .t{fill:none;stroke:rgba(255,255,255,.08);stroke-width:2}
.me .p{fill:none;stroke:var(--ac);stroke-width:2;stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--soft)}
.me span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s3)}
.me .dot{position:absolute;top:1px;right:1px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--bg);display:none}
.me.new .dot{display:block;animation:pop .4s var(--spring)}
.hdr-m{flex:1;min-width:0}
.hello{font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{margin-top:2px;font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub .urgent{color:#FCA5A5}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);color:var(--t1);font-size:18px;transition:transform .3s var(--spring),background .2s;flex:none;position:relative}
.ibtn:active{transform:scale(.9);background:var(--s3)}
.ibtn.sm{width:34px;height:34px;font-size:17px}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px}
.hero{padding:18px 18px 0;cursor:pointer;transition:transform .25s var(--ease);overflow:hidden}
.hero:active{transform:scale(.99)}
.h-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--t2);font-weight:500;min-height:22px}
.live{display:none;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--t1);padding:3px 9px 3px 8px;border-radius:999px;background:var(--s3)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ac);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
body.focusing .live{display:inline-flex;animation:fadeIn .4s}
.h-amt{margin-top:6px;font-size:42px;font-weight:600;letter-spacing:-.045em;color:var(--t1);transition:transform .45s var(--spring);transform-origin:left center}
.h-amt.bump{transform:scale(1.03)}
.h-delta{margin-top:8px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 6px;border-radius:8px;font-size:13px;font-weight:600;background:var(--s3);color:var(--t2)}
.h-delta.up{background:rgba(52,211,153,.1);color:var(--pos)}.h-delta.down{background:rgba(248,113,113,.1);color:var(--neg)}
.h-delta .ic{font-size:13px}
.h-goal{display:block;width:calc(100% + 36px);margin:18px -18px 0;padding:14px 18px 16px;border-top:1px solid var(--line);text-align:left;transition:background .2s}
.h-goal:active{background:var(--s2)}
.hm-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--t2)}
.hm-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-row b{color:var(--t1);font-weight:500;white-space:nowrap}

/* odometer */
.odo{display:inline-flex;align-items:flex-end;white-space:nowrap;line-height:1.1}
.od{display:inline-block;height:1.1em;overflow:hidden}
.odc{display:flex;flex-direction:column;transform:translateY(calc(var(--d,0) * -1.1em));transition:transform .85s var(--soft)}
.odc>span{display:block;height:1.1em;line-height:1.1em}
.os{display:inline-block;line-height:1.1em}
.odo .cur{font-size:.6em;align-self:flex-start;margin:.14em .05em 0 0;color:var(--t2);font-weight:500}
.odo .dec{font-size:.6em;margin-bottom:.1em;color:var(--t3)}

/* bars */
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--ac);transition:width 1s var(--soft)}
.bar.thin{height:3px;margin-top:9px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tile{padding:13px 13px 14px;border-radius:20px;background:var(--s1);border:1px solid var(--line);text-align:left;min-width:0;transition:transform .25s var(--ease),background .2s}
.tile:active{transform:scale(.97);background:var(--s2)}
.tl-k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);font-weight:500}
.tl-k .ic{font-size:13px}
.tile:nth-child(1) .tl-k .ic{color:var(--pos)}.tile:nth-child(2) .tl-k .ic{color:var(--ac2)}.tile:nth-child(3) .tl-k .ic{color:var(--fire)}
.tl-v{font-size:19px;font-weight:600;letter-spacing:-.03em;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-v small{font-size:13px;color:var(--t3);font-weight:500;letter-spacing:0}
.tl-s{font-size:11.5px;color:var(--t3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .bar{height:3px;margin-top:10px}

/* tasks */
.sec{display:flex;align-items:center;gap:10px;margin:26px 4px 10px}
.sec h2{font-size:18px;font-weight:600;letter-spacing:-.025em}
.sec .cnt{color:var(--t3);font-size:13.5px;flex:1;padding-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec .lnk{font-size:13.5px;color:var(--t2);font-weight:500;padding:6px 2px}
.list{border-radius:20px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.trow{position:relative;overflow:hidden;touch-action:pan-y;cursor:pointer}
.trow+.trow{border-top:1px solid var(--line)}
.tr-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:13.5px;font-weight:600;opacity:0;transition:background .2s}
.tr-bg span{display:flex;align-items:center;gap:7px;transition:transform .3s var(--spring)}
.tr-bg .ic{font-size:17px}
.trow.sw-r .tr-bg{opacity:1;background:rgba(52,211,153,.12);color:var(--pos)}
.trow.sw-l .tr-bg{opacity:1;background:rgba(251,146,60,.12);color:var(--fire)}
.trow.sw-r .tr-bg .r,.trow.sw-l .tr-bg .l{visibility:hidden}
.trow.armed.sw-r .tr-bg{background:rgba(52,211,153,.22)}
.trow.armed.sw-l .tr-bg{background:rgba(251,146,60,.2)}
.trow.armed .tr-bg span{transform:scale(1.08)}
.tr-in{position:relative;display:flex;align-items:center;gap:13px;padding:14px 16px;min-height:64px;background:var(--s1);transition:transform .5s var(--spring),background .2s}
.trow.drag .tr-in{transition:background .2s}
.trow:active .tr-in{background:var(--s2)}
.tcheck{width:24px;height:24px;border-radius:50%;border:1.75px solid var(--c);flex:none;display:grid;place-items:center;position:relative;transition:background .25s,transform .35s var(--spring);color:#09090B}
.tcheck::before{content:"";position:absolute;inset:-12px}
.tcheck svg{width:14px;height:14px;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .06s var(--ease)}
.trow.done .tcheck,.trow.checking .tcheck{background:var(--c)}
.trow.done .tcheck svg,.trow.checking .tcheck svg{stroke-dashoffset:0}
.trow.checking .tcheck{transform:scale(1.12)}
.tmain{flex:1;min-width:0}
.ttitle{font-size:15px;font-weight:500;position:relative;display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top;transition:color .35s}
.ttitle::after{content:"";position:absolute;left:0;top:54%;height:1.25px;width:0;background:var(--t3);transition:width .45s var(--ease)}
.trow.done .ttitle{color:var(--t3)}
.trow.done .ttitle::after{width:100%}
.tsub{font-size:12.5px;color:var(--t2);display:flex;align-items:center;gap:6px;margin-top:2px;white-space:nowrap;overflow:hidden}
.trow.done .tsub{color:var(--t3)}
.tsub .ic{font-size:12px;color:var(--t3)}
.tsub .tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:rgba(251,146,60,.12);color:var(--fire)}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.tpay{font-size:13.5px;font-weight:600;color:var(--lc);white-space:nowrap;animation:pop .4s var(--spring) both}
.enter{animation:enter .45s var(--soft) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.empty{padding:28px 22px 24px;text-align:center}
.em-ic{width:48px;height:48px;margin:0 auto 12px;border-radius:15px;display:grid;place-items:center;font-size:21px;color:var(--t2);background:var(--s3)}
.em-t{font-size:16px;font-weight:600}
.em-s{font-size:13.5px;color:var(--t2);margin:4px auto 16px;max-width:270px}
.empty .btn{max-width:200px;margin:0 auto;height:44px;font-size:15px}
.peek{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:14px 16px;border-radius:18px;background:transparent;border:1px solid var(--line);color:var(--t2);font-size:14px;transition:background .2s,transform .25s var(--ease)}
.peek:active{transform:scale(.985);background:var(--s1)}
.peek b{color:var(--t1);font-weight:500}
.peek .ic{font-size:16px}
.peek .sp{flex:1}
.hint-swipe{text-align:center;font-size:12px;color:var(--t3);margin-top:10px}
.banner{display:flex;align-items:center;gap:12px;margin-top:8px;padding:12px 10px 12px 14px;border-radius:20px;background:var(--s1);border:1px solid var(--line);animation:rise .5s var(--soft) both}
.banner .bi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--s3);color:var(--t1);font-size:17px;flex:none}
.banner .bt{flex:1;min-width:0;font-size:13px;color:var(--t2)}
.banner .bt b{display:block;color:var(--t1);font-size:14px;font-weight:600}
.banner .btn{width:auto;height:36px;padding:0 14px;font-size:14px;border-radius:11px}
.banner .x{color:var(--t3);font-size:16px;padding:6px}

/* ============ Buttons & inputs ============ */
.btn{height:52px;width:100%;border-radius:16px;font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;transition:transform .2s var(--ease),opacity .2s,background .25s;letter-spacing:-.01em}
.btn:active{transform:scale(.98);opacity:.88}
.btn .ic{font-size:18px}
.btn.primary{background:var(--t1);color:#09090B}
.btn.ghost{background:var(--s2);border:1px solid var(--line2);color:var(--t1)}
.btn.text{height:44px;color:var(--t2);font-weight:500;font-size:15px}
.btn.sm{height:44px;font-size:15px;border-radius:14px}
.btn.danger{color:var(--neg)}
.hold{background:var(--s2);border:1px solid rgba(248,113,113,.22);color:#FCA5A5;touch-action:none}
.hold:active{opacity:1}
.hold .hfill{position:absolute;inset:0;background:rgba(248,113,113,.2);transform:scaleX(0);transform-origin:left;pointer-events:none}
.htx{position:relative;z-index:1;display:grid;place-items:center;pointer-events:none}
.htx b{grid-area:1/1;font-weight:600;white-space:nowrap;transition:opacity .2s,transform .3s var(--soft)}
.htx .h2{opacity:0;transform:translateY(7px)}
.hold.holding .htx .h1{opacity:0;transform:translateY(-7px)}
.hold.holding .htx .h2{opacity:1;transform:none}
.field{width:100%;height:52px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);padding:0 16px;font-size:17px;outline:none;transition:border-color .2s}
.field::placeholder{color:var(--t3)}
.field:focus{border-color:var(--line3)}
.lbl{font-size:13px;color:var(--t2);margin:20px 3px 10px;display:flex;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--t2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:none;transition:background .2s,border-color .2s,color .2s,transform .25s var(--spring);position:relative;overflow:hidden}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--t1);border-color:var(--t1);color:#09090B}
.chip .ic{font-size:15px}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cd{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding-top:10px}
.wd{height:38px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--t2);transition:all .2s var(--ease);text-align:center}
.wd.on{background:var(--t1);border-color:var(--t1);color:#09090B}
.wd:active{transform:scale(.92)}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;z-index:1;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--s4);transition:background .25s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .35s var(--spring)}
.switch input:checked+i{background:var(--ac)}
.switch input:checked+i::after{transform:translateX(20px)}
.seg{display:flex;position:relative;padding:3px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.seg button{flex:1;height:30px;border-radius:9px;font-size:13px;font-weight:500;color:var(--t2);position:relative;z-index:1;transition:color .25s;text-align:center;padding:0 8px;white-space:nowrap}
.seg button.on{color:var(--t1)}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--s4);transition:transform .45s var(--soft),width .45s var(--soft)}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ac) var(--v,50%),var(--s4) var(--v,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 1px 5px rgba(0,0,0,.4)}

/* ============ Plan ============ */
.vhead{margin:2px 2px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.vhead h1{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.15}
.pill{height:34px;padding:0 13px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--t2);display:inline-flex;align-items:center;gap:7px;transition:all .25s}
.pill .ic{font-size:15px}
.pill.on{color:var(--t1);border-color:var(--line3)}
.cal{padding:12px 10px 8px;overflow:hidden}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-m{font-size:15.5px;font-weight:600;letter-spacing:-.015em}
.cal-h .ibtn{background:transparent;border-color:transparent;color:var(--t2)}
.cal-w{display:grid;grid-template-columns:repeat(7,1fr);font-size:11.5px;color:var(--t3);text-align:center;font-weight:500;padding-bottom:4px}
.cal-gw{position:relative;touch-action:pan-y}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;position:relative;z-index:1}
.cal-g.mvl{animation:calL .4s var(--soft)}.cal-g.mvr{animation:calR .4s var(--soft)}
@keyframes calL{from{opacity:0;transform:translateX(30px)}}
@keyframes calR{from{opacity:0;transform:translateX(-30px)}}
.cal-sel{position:absolute;z-index:0;top:0;left:0;width:40px;height:40px;border-radius:12px;background:var(--t1);transition:transform .45s var(--spring),opacity .25s;pointer-events:none;opacity:0}
.cal-sel.nt{transition:opacity .25s}
.cc{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;gap:6px;position:relative;font-size:14.5px;font-weight:500;color:var(--t1);border-radius:12px;transition:color .25s}
.cc b{font-weight:500;line-height:1;height:16px;display:flex;align-items:center;justify-content:center;transition:color .25s}
.cc.out{opacity:.35}
.cc.past b{color:var(--t2)}
.cc.now b{color:var(--ac2);font-weight:700}
.cc.sel b{color:#09090B!important;font-weight:600}
.cc .cdt{display:flex;gap:2px;height:4px;align-items:center}
.cc .cdt i{width:4px;height:4px;border-radius:50%;background:var(--t3)}
.cc .cdt.ok i{background:var(--pos)}
.cc .cdt.part i{background:transparent;box-shadow:inset 0 0 0 1.2px var(--pos)}
.cc .cdt.miss i{background:var(--neg)}
.cc .cdt.fut i{background:var(--t2)}
.cc .cdt.nowp i{background:var(--ac)}
.cc.sel .cdt i{background:#09090B!important;box-shadow:none}
.dayh{display:flex;align-items:center;gap:10px;margin:22px 4px 10px}
.dayh .m{flex:1;min-width:0}
.dayh h2{font-size:18px;font-weight:600;letter-spacing:-.025em}
.dayh .s{font-size:13px;color:var(--t2);margin-top:1px}
.prow{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;transition:background .2s;position:relative}
.prow+.prow{border-top:1px solid var(--line)}
.prow:active{background:var(--s2)}
.prow .pi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-size:14px}
.prow .chev{color:var(--t3);font-size:15px}
.prow .amt{font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--lc)}
.prow.miss .ttitle{color:var(--t3)}
.prow.miss .pi{background:rgba(248,113,113,.1);color:var(--neg)}
.prow.ro{cursor:default}

/* ============ Focus view ============ */
.ring-wrap{position:relative;width:min(72vw,276px);aspect-ratio:1;margin:6px auto 18px}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:rgba(255,255,255,.06);stroke-width:4}
.ring-prog{fill:none;stroke:var(--ac);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:150px 150px;transition:stroke-dashoffset .9s linear}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rc-l{font-size:13px;color:var(--t2);font-weight:500}
.rc-t{font-size:54px;font-weight:600;letter-spacing:-.05em;margin:6px 0 4px;color:var(--t1)}
.rc-e{font-size:16px;font-weight:600;color:var(--pos);letter-spacing:-.015em;min-height:22px}
.rc-e.idle{color:var(--t2)}
.rc-m{margin-top:12px;font-size:12px;height:24px;line-height:22px;padding:0 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line2);color:var(--t2);font-weight:600}
.sgoal{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.sgoal .chip{height:32px;padding:0 13px;font-size:13px}
.sgoal.lock .chip:not(.on){opacity:.35;pointer-events:none}
.finfo{padding:16px 18px}
.fi+.fi{margin-top:16px}
.fi-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--t2)}
.fi-row b{color:var(--t1);font-weight:500;white-space:nowrap}
.fi.hit .fi-row b{color:var(--pos)}
.fi-s{font-size:12px;color:var(--t3);margin-top:7px}
.fi-s.rec{color:var(--pos)}
.fbtns{margin-top:14px}
.hint{text-align:center;font-size:12.5px;color:var(--t3);margin:12px 10px 0;line-height:1.45}

/* ============ Stats view ============ */
.chart-card{padding:16px 0 12px}
.cc-h{display:flex;justify-content:space-between;align-items:flex-start;padding:0 16px;gap:10px}
.cc-k{font-size:13px;color:var(--t2)}
.cc-v{font-size:24px;font-weight:600;letter-spacing:-.035em;margin-top:2px}
.cc-c{font-size:13px;font-weight:500;margin-top:2px}
.cc-c.up{color:var(--pos)}.cc-c.down{color:var(--neg)}
.chart{position:relative;height:150px;margin-top:8px;touch-action:pan-y}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.c-line{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.3s var(--soft) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.c-area{animation:fadeIn 1s .3s both}
.c-scrub{opacity:0;transition:opacity .2s}.c-scrub.on{opacity:1}
.c-scrub line{stroke:rgba(255,255,255,.2);stroke-dasharray:3 3}
.c-dot{fill:var(--t1);stroke:var(--s1);stroke-width:3}
.c-end{fill:var(--t1);stroke:var(--s1);stroke-width:2;animation:pop .4s 1.2s var(--spring) both;transform-box:fill-box;transform-origin:center}
.tip{position:absolute;top:-8px;left:50%;transform:translateX(-50%);padding:5px 9px;border-radius:9px;background:var(--s3);border:1px solid var(--line2);font-size:12px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.tip.on{opacity:1}
.chart-card .seg{margin:6px 16px 0}
.heat-card{margin-top:10px;padding:16px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:14px;animation:fadeIn .6s .1s both}
.heat i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.05)}
.heat i.l1{background:rgba(var(--acr),.22)}.heat i.l2{background:rgba(var(--acr),.4)}.heat i.l3{background:rgba(var(--acr),.6)}.heat i.l4{background:rgba(var(--acr),.8)}.heat i.l5{background:var(--ac)}
.heat i.fut{background:transparent}
.heat i.now{box-shadow:inset 0 0 0 1.5px var(--t1)}
.heat-leg{display:flex;align-items:center;justify-content:space-between;gap:3px;font-size:11px;color:var(--t3);margin-top:10px}
.heat-leg span{display:flex;align-items:center;gap:3px}
.heat-leg i{width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.05)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{padding:14px 16px;border-radius:18px;background:var(--s1);border:1px solid var(--line)}
.st-k{font-size:12.5px;color:var(--t2);display:flex;align-items:center;gap:7px}
.st-k .ic{font-size:14px;color:var(--t3)}
.st-v{font-size:20px;font-weight:600;letter-spacing:-.03em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week{margin-top:10px;padding:16px}
.w-h{display:flex;justify-content:space-between;align-items:baseline}
.w-h h3{font-size:15px;font-weight:600;letter-spacing:-.015em}
.w-h span{font-size:12.5px;color:var(--t2)}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:16px;position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%;position:relative;z-index:1}
.bars .b i{width:100%;max-width:24px;border-radius:6px 6px 3px 3px;background:var(--s4);transform-origin:bottom;animation:grow .8s var(--soft) both;min-height:3px}
.bars .b.has i{background:rgba(var(--acr),.55)}
.bars .b.top i{background:var(--ac)}
.bars .b span{font-size:11px;color:var(--t3)}
.bars .b.today span{color:var(--t1);font-weight:600}
@keyframes grow{from{transform:scaleY(0)}}
.goal-line{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.16);z-index:0}
.goal-line span{position:absolute;right:0;top:-16px;font-size:10.5px;color:var(--t3)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 16px}
.lrow+.lrow{border-top:1px solid var(--line)}
.lic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:var(--lcg);color:var(--lc);flex:none}
.lm{flex:1;min-width:0}
.lt{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls{font-size:12.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.la{font-size:14.5px;font-weight:500;white-space:nowrap}
.la.neg{color:var(--neg)}.la.ok{color:var(--pos)}.la.hi{color:var(--lc)}
.lday{display:flex;justify-content:space-between;padding:12px 16px 6px;font-size:12.5px;color:var(--t2);border-top:1px solid var(--line)}
.lday:first-child{border-top:0}
.more{display:block;width:100%;padding:14px;text-align:center;color:var(--t1);font-weight:500;font-size:14px;border-top:1px solid var(--line)}

/* ============ You view ============ */
.prof{padding:20px 18px 18px;text-align:center}
.pav{width:84px;height:84px;margin:2px auto 12px;position:relative;display:grid;place-items:center}
.pav svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pav .t{fill:none;stroke:rgba(255,255,255,.07);stroke-width:3}
.pav .p{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1.3s var(--soft)}
.pav span{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:600;background:var(--s3)}
.pname{font-size:21px;font-weight:600;letter-spacing:-.025em}
.prank{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;font-weight:500;color:var(--t2)}
.prank .ic{font-size:14px;color:var(--ac2)}
.prof .bar{margin-top:18px}
.pnext{display:flex;justify-content:space-between;font-size:12.5px;color:var(--t2);margin-top:9px;text-align:left}
.pnext b{color:var(--t1);font-weight:500}
.nx{display:flex;align-items:center;gap:13px;padding:14px 16px}
.nx+.nx{border-top:1px solid var(--line)}
.nx-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:var(--lcg);color:var(--lc);flex:none}
.nx-m{flex:1;min-width:0}
.nx-t{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:500}
.nx-t span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx-t span:last-child{color:var(--lc);font-weight:600;font-size:13px;white-space:nowrap}
.nx-s{font-size:12px;color:var(--t3);margin-top:2px}
.nx .bar{margin-top:9px;height:3px}
.nx .bar i{background:var(--lc)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{padding:16px 8px 13px;border-radius:18px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;position:relative;overflow:hidden;transition:transform .25s var(--spring),background .2s}
.bdg:active{transform:scale(.96);background:var(--s2)}
.bdg .coin{margin-bottom:9px}
.bdg .emb{display:block;margin:0 auto 9px;flex:none}
.nt-ic.em{background:none;width:40px;height:40px}
.nt-ic.em .emb{width:40px;height:40px;display:block}
.bd-hero{text-align:center;padding:2px 0 4px}
.bd-hero .emb{display:block;margin:0 auto 12px}
.bd-lv{font-size:17px;font-weight:600;letter-spacing:-.02em}
.bd-d{font-size:13.5px;color:var(--t2);margin-top:4px}
.bd-next{margin-top:20px;padding:16px 16px 15px;border-radius:18px;background:var(--s2);border:1px solid var(--line)}
.bd-k{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--t2)}
.bd-k b{color:var(--t1);font-weight:600}
.bd-t{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1.3}
.bd-next .bar{margin-top:12px}
.bd-s{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--t2);margin-top:8px}
.bd-why{font-size:12.5px;color:var(--t3);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);line-height:1.45}
.bd-mini{flex:none;display:block;width:34px;height:34px}
.bd-mini .emb{display:block}
.bdg .bn{font-size:12.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bdg .bl{font-size:11px;color:var(--t2)}
.bdg.lock .bn{color:var(--t2)}.bdg.lock .bl{color:var(--t3)}
.bdg .nw{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:700;color:#09090B;background:var(--t1);padding:1px 5px;border-radius:5px;animation:pop .4s var(--spring)}
.coin{position:relative;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--lcg);color:var(--lc);flex:none}
.coin svg.cr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.coin .ct{fill:none;stroke:var(--lc);stroke-width:1.5;opacity:.55}
.coin .cp{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linecap:round}
.coin.lock{background:var(--s2);color:var(--t3)}
.coin.lock .ct{stroke:var(--line2);opacity:1}
.coin.lg{width:84px;height:84px;font-size:32px;margin:0 auto}
.coin .lvn{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--bg);border:1.5px solid var(--lc);font-size:10px;font-weight:700;line-height:15px;color:var(--t1)}
.srow2{display:flex;align-items:center;gap:13px;padding:0 16px;min-height:54px;width:100%;text-align:left;position:relative;transition:background .2s}
.srow2+.srow2{border-top:1px solid var(--line)}
.srow2:active{background:var(--s2)}
.srow2 .si{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:var(--t1);background:var(--s3);flex:none}
.srow2 .sl{flex:1;font-size:15px}
.srow2 .sv{color:var(--t2);font-size:13.5px;display:flex;align-items:center;gap:6px}
.srow2 .sv .ic{color:var(--t3);font-size:15px}
.ms{display:flex;align-items:center;gap:14px;padding:10px 2px}
.ms-n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;background:var(--s2);border:1px solid var(--line2);color:var(--t3);flex:none;position:relative}
.ms-n .ic{font-size:16px}
.ms.done .ms-n{background:var(--t1);border-color:var(--t1);color:#09090B}
.ms.next .ms-n{background:conic-gradient(var(--ac) calc(var(--p) * 1%),var(--s3) 0);border:0}
.ms.next .ms-n::before{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--s1)}
.ms.next .ms-n b{position:relative;font-size:10.5px;color:var(--t1)}
.ms-b{flex:1;min-width:0}
.ms-t{display:flex;justify-content:space-between;font-size:15px;font-weight:500}
.ms.locked .ms-t{color:var(--t2)}
.ms-bonus{font-size:13px;color:var(--t1);font-weight:600}
.ms.locked .ms-bonus{color:var(--t3)}
.ms-s{font-size:12.5px;color:var(--t3);margin-top:2px}

/* ============ Dock ============ */
.dock-fade{position:absolute;left:0;right:0;bottom:0;height:calc(var(--dock-h) + var(--safe-b) + 44px);z-index:29;pointer-events:none;background:linear-gradient(to bottom,rgba(9,9,11,0),rgba(9,9,11,.85) 55%,var(--bg));transition:opacity .4s}
#app.onb .dock,#app.onb .dock-fade{opacity:0}
#app.onb .dock{transform:translate(-50%,140%)}
.dock{position:absolute;left:50%;bottom:calc(var(--safe-b) + 14px);transform:translateX(-50%);z-index:30;height:var(--dock-h);padding:5px;border-radius:999px;display:flex;align-items:center;gap:2px;
  background:rgba(24,24,27,.9);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.08);
  box-shadow:0 12px 32px -10px rgba(0,0,0,.8);transition:transform .5s var(--soft),opacity .4s}
.dock-ind{position:absolute;top:5px;left:0;height:50px;width:50px;border-radius:999px;background:var(--s4);pointer-events:none;transition:opacity .25s}
.dk{position:relative;z-index:1;height:50px;min-width:50px;padding:0 14px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--t3);transition:color .3s}
.dk .ic{font-size:20px;transition:transform .45s var(--spring)}
.dk:active .ic{transform:scale(.85)}
.dk .lb{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:13.5px;font-weight:600;letter-spacing:-.01em;transition:max-width .45s var(--soft),opacity .25s,margin .45s var(--soft)}
.dk.on{color:var(--t1)}
.dk.on .lb{max-width:84px;opacity:1;margin-left:7px}
.dk .bd{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--ac);border:2px solid var(--s2);transform:scale(0);transition:transform .35s var(--spring)}
.dk.new .bd{transform:scale(1)}
.orb{position:relative;z-index:1;width:46px;height:46px;margin:0 7px;border-radius:50%;display:grid;place-items:center;color:#09090B;background:var(--t1);transition:transform .35s var(--spring)}
.orb:active{transform:scale(.9)}
.orb .pl,.orb .ow{grid-area:1/1;display:grid;place-items:center;transition:transform .35s var(--spring),opacity .25s}
.orb .ic{font-size:19px}
.orb .ow{opacity:0;transform:scale(.6)}
.orb .ow .wave i{background:#09090B}
.orb svg.orr{position:absolute;inset:-4px;width:54px;height:54px;transform:rotate(-90deg);pointer-events:none;opacity:0;transition:opacity .3s}
.orb svg.orr circle{fill:none;stroke-width:2.5}
.orb svg.orr .p{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.orb svg.orr .t{stroke:rgba(255,255,255,.08)}
body.focusing .orb svg.orr,.orb.charge svg.orr{opacity:1}
.orb.charge{transform:scale(1.06)}
.orb.charge svg.orr .p{stroke-dashoffset:0!important;transition:stroke-dashoffset .48s linear!important}
body.focusing .orb .pl{opacity:0;transform:scale(.5)}
body.focusing .orb .ow{opacity:1;transform:none}

/* ============ Toast ============ */
.toast{position:absolute;left:50%;bottom:calc(var(--dock-h) + var(--safe-b) + 26px);z-index:380;transform:translate(-50%,16px);opacity:0;padding:10px 15px;border-radius:13px;background:var(--s3);border:1px solid var(--line2);font-size:13.5px;font-weight:500;transition:.4s var(--soft);pointer-events:none;white-space:nowrap;box-shadow:0 12px 30px -10px rgba(0,0,0,.7);max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ Sheets ============ */
#sheets{position:absolute;inset:0;z-index:100;pointer-events:none}
.sheet-wrap{position:absolute;inset:0;pointer-events:auto;isolation:isolate}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .35s}
.sheet-wrap.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--top) - 4px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  background:var(--s1);border-radius:26px 26px 0 0;border-top:1px solid var(--line2);
  padding:10px 20px calc(24px + var(--safe-b));transform:translateY(105%);transition:transform .5s var(--soft)}
.sheet::-webkit-scrollbar{display:none}
.sheet.tall{height:calc(100% - var(--top) - 4px)}
.sheet-wrap.open .sheet{transform:none}
.handle{width:36px;height:4px;border-radius:9px;background:var(--s4);margin:0 auto 16px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sh-head h3{font-size:21px;font-weight:600;letter-spacing:-.03em}
.sh-sub{font-size:14px;color:var(--t2);margin:-4px 0 14px;line-height:1.45}
.stag>*{animation:rise .45s var(--soft) both}
.stag>*:nth-child(2){animation-delay:.03s}.stag>*:nth-child(3){animation-delay:.06s}.stag>*:nth-child(4){animation-delay:.09s}.stag>*:nth-child(5){animation-delay:.12s}.stag>*:nth-child(n+6){animation-delay:.15s}
.sbody>.sgroup{animation:rise .45s var(--soft) both}
.sbody>.sgroup:nth-child(2){animation-delay:.04s}.sbody>.sgroup:nth-child(3){animation-delay:.08s}.sbody>.sgroup:nth-child(n+4){animation-delay:.12s}
.hint2{font-size:12.5px;color:var(--t3);margin-top:2px;line-height:1.35}
.disc{display:flex;align-items:center;gap:6px;margin-top:18px;font-size:14px;color:var(--t2);font-weight:500}
.disc .ic{transition:transform .35s var(--spring)}
.disc.open .ic{transform:rotate(90deg)}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--soft)}
.fold.open{grid-template-rows:1fr}
.fold>div{overflow:hidden}
.ol{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;font-size:13.5px;padding:8px 0}
.ol:first-child{padding-top:14px}
.ol i{width:7px;height:7px;border-radius:50%;background:var(--lc)}
.ol b{font-weight:600;color:var(--lc);text-align:right;min-width:42px}
.ol em{font-style:normal;color:var(--t2);text-align:right;min-width:104px}
.sh-actions{margin-top:22px;display:grid;gap:6px}
.counter{font-size:13px;color:var(--pos);opacity:0;transition:opacity .3s;margin-left:auto}
.counter.on{opacity:1}
.sgroup{margin-top:20px}
.sg-t{font-size:13px;color:var(--t2);margin:0 6px 8px}
.sg-n{font-size:12.5px;color:var(--t3);margin:8px 6px 0;line-height:1.45}
.sg-b{border-radius:16px;background:var(--s2);border:1px solid var(--line);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;min-height:52px;padding:9px 14px;width:100%;text-align:left;transition:background .2s;position:relative}
.srow+.srow{border-top:1px solid var(--line)}
button.srow:active{background:var(--s3)}
.srow .si{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;color:var(--t1);flex:none;background:var(--s4)}
.sl{flex:1;min-width:0;font-size:15px;display:flex;flex-direction:column}
.sl>span{display:flex;align-items:center;gap:9px}
.sin{display:flex;align-items:center;gap:5px;color:var(--t2);font-size:14px}
.sin input,.ssel,.stext{height:36px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line2);padding:0 10px;font-size:16px;color:var(--t1);outline:none;transition:border-color .2s}
.sin input{width:90px;text-align:right}
.sin input:disabled{opacity:.4}
.stext{width:150px;text-align:right}
.ssel{appearance:none;-webkit-appearance:none;padding:0 12px;text-align:right}
.sin input:focus,.stext:focus,.ssel:focus{border-color:var(--line3)}
.sv{display:flex;align-items:center;gap:6px;color:var(--t2);font-size:14px;white-space:nowrap}
.sv .ic{font-size:16px;color:var(--t3)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line2);display:grid;place-items:center;font-size:16px;transition:transform .2s var(--spring)}
.step button:active{transform:scale(.9)}
.step b{min-width:62px;text-align:center;font-weight:500;font-size:15px}
.foot{text-align:center;font-size:12px;color:var(--t3);margin:24px 0 4px;display:flex;flex-direction:column;align-items:center;gap:8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;background:var(--c);position:relative;transition:transform .25s var(--spring)}
.sw.on{box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--t1)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.th{height:52px;border-radius:13px;border:1px solid var(--line2);background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:500;color:var(--t2);transition:all .2s var(--ease)}
.th i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.th.on{border-color:var(--t1);color:var(--t1)}
.tier,.ed{padding:12px 14px 14px;border-radius:15px;background:var(--s2);border:1px solid var(--line);margin-top:8px;animation:rise .4s var(--soft) both}
.tier-top{display:flex;align-items:center;gap:10px}
.lvdot{width:8px;height:8px;border-radius:50%;background:var(--lc);flex:none}
.tier-name{flex:1;background:none;border:0;font-size:15px;font-weight:600;outline:none;min-width:0;padding:4px 0;color:var(--t1)}
.tier-del{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--t3);font-size:15px;flex:none}
.tier-grid{display:grid;grid-template-columns:1fr 1fr 78px;gap:8px;margin-top:8px}
.tier-grid.two{grid-template-columns:1fr}
.tf{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--t3)}
.tf input,.tf select{height:40px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line2);padding:0 10px;font-size:16px;outline:none;width:100%;min-width:0;color:var(--t1);appearance:none;-webkit-appearance:none}
.tf input:focus,.tf select:focus{border-color:var(--line3)}
.rk{padding:8px 6px 8px 14px;margin-top:6px}
.rk-h{display:flex;justify-content:space-between;font-size:12px;color:var(--t3);padding:0 50px 2px 14px}
.rk-at{display:flex;align-items:center;gap:5px;color:var(--t3);font-size:13px}
.rk-at input{width:118px;height:38px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line2);padding:0 10px;font-size:16px;text-align:right;color:var(--t1);outline:none}
.rk-at input:focus{border-color:var(--line3)}
@media (max-width:380px){.rk-at input{width:100px}}
.obar{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:8px}
.obar i{background:var(--lc);transition:flex-grow .4s var(--ease);min-width:3px}
.onote{font-size:12.5px;color:var(--t2)}
.mins{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.mins .chip{height:32px;padding:0 6px 0 13px;color:var(--t1)}
.mins .chip .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--t3);font-size:12px}
.mins input{width:84px;height:32px;border-radius:999px;background:transparent;border:1px dashed var(--line3);padding:0 12px;font-size:14px;outline:none;color:var(--t1)}
.steps{display:grid;gap:12px;margin:6px 0 4px;counter-reset:st}
.steps li{list-style:none;display:flex;gap:12px;font-size:14.5px;color:var(--t2);line-height:1.45}
.steps li::before{counter-increment:st;content:counter(st);width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--t1);background:var(--s3)}
.steps b{color:var(--t1);font-weight:600}

/* levels */
.lv-common{--lc:#A1A1AA;--lcg:rgba(161,161,170,.12)}
.lv-rare{--lc:#60A5FA;--lcg:rgba(96,165,250,.13)}
.lv-epic{--lc:#A78BFA;--lcg:rgba(167,139,250,.14)}
.lv-legendary{--lc:#E879F9;--lcg:rgba(232,121,249,.13)}
.lv-penalty{--lc:#F87171;--lcg:rgba(248,113,113,.12)}
.lv-safe{--lc:#34D399;--lcg:rgba(52,211,153,.12)}
.lv-focus,.lv-accent{--lc:var(--ac2);--lcg:rgba(var(--acr),.13)}
.lv-fire{--lc:#FB923C;--lcg:rgba(251,146,60,.13)}
.lv-pink{--lc:#F472B6;--lcg:rgba(244,114,182,.13)}
.lv-green{--lc:#34D399;--lcg:rgba(52,211,153,.12)}

/* ============ Overlays ============ */
.overlay{position:absolute;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.overlay.show{opacity:1;visibility:visible;transition:opacity .25s}

#reveal{background:rgba(0,0,0,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.rv-card{position:relative;width:100%;max-width:320px;padding:24px 22px 20px;border-radius:26px;background:var(--s1);border:1px solid var(--line2);text-align:center;transform:translateY(18px) scale(.96);opacity:0;transition:transform .55s var(--soft),opacity .3s,border-color .5s}
#reveal.show .rv-card{transform:none;opacity:1}
#reveal.landed .rv-card{border-color:color-mix(in srgb,var(--lc) 40%,transparent)}
#reveal.landed.big .rv-card{animation:thud .45s var(--ease)}
@keyframes thud{30%{transform:scale(1.025)}}
.rv-k{font-size:13px;color:var(--t2);font-weight:500}
.amt-roll{display:flex;justify-content:center;align-items:flex-end;line-height:1;height:1em;overflow:hidden;font-weight:600;letter-spacing:-.045em}
.rv-amt{margin:18px 0 16px;font-size:44px;color:var(--t1)}
.dg{display:inline-block;height:1em;overflow:hidden}
.strip{display:flex;flex-direction:column;transition:transform 1s cubic-bezier(.12,.86,.22,1)}
.strip span,.nd{height:1em;line-height:1;display:block}
.nd{display:inline-block}
.amt-roll .sm{font-size:.6em;align-self:flex-start;margin-right:.05em;color:var(--t2);font-weight:500}
.amt-roll .dec{font-size:.6em;color:var(--t3);margin-bottom:.06em}
.rv-st{display:grid;place-items:center;height:28px}
.rv-st>*{grid-area:1/1;transition:opacity .3s,transform .45s var(--soft)}
.rv-roll{display:flex;gap:5px}
.rv-roll i{width:5px;height:5px;border-radius:50%;background:var(--t3);animation:blink 1s ease-in-out infinite}
.rv-roll i:nth-child(2){animation-delay:.15s}.rv-roll i:nth-child(3){animation-delay:.3s}
.rv-tier{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;background:var(--lcg);color:var(--lc);font-size:13px;font-weight:600;opacity:0;transform:translateY(6px)}
.rv-tier i{width:6px;height:6px;border-radius:50%;background:var(--lc)}
#reveal.landed .rv-roll{opacity:0}
#reveal.landed .rv-tier{opacity:1;transform:none}
.rv-title{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-btn{position:relative;margin-top:14px;max-width:320px;opacity:0;transform:translateY(10px);transition:opacity .3s .1s,transform .5s .1s var(--soft);pointer-events:none}
#reveal.landed .rv-btn{opacity:1;transform:none;pointer-events:auto}
.rv-hint{position:relative;margin-top:12px;font-size:12px;color:var(--t3);opacity:0;transition:opacity .4s .4s}
#reveal.landed .rv-hint{opacity:1}
.flyer{position:absolute;z-index:390;font-size:22px;font-weight:600;color:var(--t1);pointer-events:none;white-space:nowrap;letter-spacing:-.03em}

#celebrate{text-align:center;background:rgba(0,0,0,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.cb-in{position:relative;width:100%;max-width:330px}
.cb-in>*{opacity:0;transform:translateY(10px)}
#celebrate.show .cb-in>*{animation:cbIn .6s var(--soft) forwards;animation-delay:calc(var(--d,0) * 70ms + 120ms)}
@keyframes cbIn{to{opacity:1;transform:none}}
.cb-ic{width:72px;height:72px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;font-size:32px;color:var(--lc);background:var(--lcg);border:1px solid color-mix(in srgb,var(--lc) 30%,transparent)}
#celebrate.show .cb-ic{animation:cbPop .7s var(--spring) forwards .05s}
@keyframes cbPop{0%{opacity:0;transform:scale(.5) rotate(-12deg)}100%{opacity:1;transform:none}}
.cb-k{font-size:13px;color:var(--lc);font-weight:600}
.cb-t{font-size:32px;font-weight:600;letter-spacing:-.04em;line-height:1.1;margin-top:6px}
.cb-a{font-size:19px;font-weight:600;color:var(--t1);margin-top:10px;letter-spacing:-.02em}
.cb-s{color:var(--t2);font-size:14.5px;margin:10px auto 0;max-width:290px;line-height:1.5}
.cb-s b{color:var(--t1);font-weight:600}
.cb-btn{margin-top:28px}

#report{justify-content:flex-start;overflow-y:auto;background:var(--bg);padding:calc(var(--top) + 12px) 16px calc(var(--safe-b) + 24px)}
.rp{width:100%;max-width:400px;margin:0 auto}
.rp>*:not(.rp-tot):not(.rp-st):not(.btn){animation:rise .6s var(--soft) both}
.rp-k{font-size:13.5px;color:var(--t2)}
.rp-d{font-size:27px;font-weight:600;letter-spacing:-.035em;margin-top:2px}
.rp-sum{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border-radius:18px;background:var(--s1);border:1px solid var(--line)}
.rp-sum>div{padding:13px 14px;position:relative}
.rp-sum>div+div::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:1px;background:var(--line)}
.rp-sum span{display:block;font-size:12px;color:var(--t2)}
.rp-sum b{display:block;font-size:17px;font-weight:600;margin-top:3px;letter-spacing:-.02em;white-space:nowrap}
.rp-rec{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px 14px;border-radius:14px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);color:var(--pos);font-size:14px}
.rp-rec .ic{font-size:18px}
.rp-rec b{font-weight:600}
.rp-gap{margin-top:10px;font-size:13.5px;color:#FCA5A5;padding:10px 14px;border-radius:14px;background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.18)}
.rp-sec{font-size:13px;color:var(--t2);margin:24px 4px 9px}
.rp-pens{border-radius:18px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.rp-pen{display:flex;align-items:center;gap:12px;padding:13px 16px;opacity:0;transform:translateX(-10px);transition:opacity .4s,transform .5s var(--soft)}
.rp-pen+.rp-pen{border-top:1px solid var(--line)}
.rp-pen.in{opacity:1;transform:none}
.rp-pl{flex:1;min-width:0}
.rp-pl div{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-tier{font-size:12.5px;color:var(--lc);opacity:0;transition:opacity .35s}
.rp-pen.landed .rp-tier{opacity:1}
.rp-amt{font-size:17px;color:var(--lc)}
.rp-amt .nd{font-weight:600;font-size:15px;color:inherit;letter-spacing:0}
.rp-amt .sm{color:inherit}
.rp-clean{padding:18px 16px;display:flex;align-items:center;gap:10px;color:var(--pos);font-weight:500}
.rp-clean .ic{font-size:18px}
.rp-tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;padding:16px 4px 0;border-top:1px solid var(--line);opacity:0;transition:opacity .5s}
.rp-tot.in{opacity:1}
.rp-tot span{color:var(--t2)}
.rp-tot b{font-size:23px;font-weight:600;letter-spacing:-.03em}
.rp-tot b.up{color:var(--pos)}.rp-tot b.down{color:var(--neg)}
.rp-st{margin-top:14px;padding:14px 16px;border-radius:16px;display:flex;align-items:center;gap:12px;font-size:14.5px;background:var(--s1);border:1px solid var(--line);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s var(--soft)}
.rp-st.in{opacity:1;transform:none}
.rp-st .ic{font-size:20px;color:var(--t2)}
.rp-st.lost{border-color:rgba(248,113,113,.22);color:#FCA5A5}
.rp-st.kept .ic{color:var(--fire)}
.rp .btn{margin-top:22px;opacity:0;transition:opacity .4s,transform .2s var(--ease)}
.rp .btn.in{opacity:1}

#checkin{background:rgba(0,0,0,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.ci{width:100%;max-width:320px;text-align:center;padding:26px 22px 20px;border-radius:26px;background:var(--s1);border:1px solid var(--line2);transform:scale(.95);opacity:0;transition:transform .5s var(--spring),opacity .3s}
#checkin.show .ci{transform:none;opacity:1}
.ci-ring{width:96px;height:96px;margin:0 auto 16px;position:relative;display:grid;place-items:center}
.ci-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ci-ring circle{fill:none;stroke-width:4}
.ci-t{font-size:22px;font-weight:600;letter-spacing:-.02em}
.ci h3{font-size:20px;font-weight:600;letter-spacing:-.025em}
.ci p{color:var(--t2);font-size:14px;margin:6px 0 20px;line-height:1.45}

.stop{text-align:center;padding-top:2px}
.stop h3{font-size:21px;font-weight:600;letter-spacing:-.03em}
.stop p{color:var(--t2);font-size:14.5px;margin:8px auto 0;max-width:300px;line-height:1.5}
.stop p b{color:var(--t1);font-weight:600}
.stop-k{display:grid;grid-template-columns:1fr 1fr;margin:18px 0;border-radius:16px;background:var(--s2);border:1px solid var(--line);text-align:left}
.stop-k>div{padding:12px 14px}
.stop-k>div+div{border-left:1px solid var(--line)}
.stop-k span{display:block;font-size:12.5px;color:var(--t2)}
.stop-k b{display:block;font-size:18px;font-weight:600;margin-top:2px;letter-spacing:-.02em}

.wipe{position:absolute;inset:0;z-index:250;pointer-events:none;background:var(--bg);clip-path:circle(0px at var(--x) var(--y));transition:clip-path .5s cubic-bezier(.7,0,.2,1),opacity .4s}
.wipe.in{clip-path:circle(150vmax at var(--x) var(--y))}
.wipe.out{opacity:0}

/* ============ Onboarding ============ */
#onboard{position:absolute;inset:0;z-index:350;background:var(--bg);overflow:hidden;transition:opacity .6s var(--ease),transform .6s var(--ease)}
#onboard.out{opacity:0;transform:scale(1.03);pointer-events:none}
.ob-top{position:absolute;left:24px;right:24px;top:calc(var(--top) + 4px);z-index:3;display:flex;align-items:center;gap:12px}
.ob-back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);font-size:17px;transition:opacity .3s}
.ob-back.hide{opacity:0;pointer-events:none}
.ob-prog{flex:1;display:flex;gap:6px}
.ob-prog i{flex:1;height:3px;border-radius:3px;background:var(--s3);overflow:hidden;position:relative}
.ob-prog i::after{content:"";position:absolute;inset:0;background:var(--t1);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--soft)}
.ob-prog i.on::after{transform:none}
.ob-step{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:calc(var(--top) + 64px) 24px calc(var(--safe-b) + 28px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(28px);transition:opacity .35s var(--ease),transform .55s var(--soft),visibility 0s .55s}
.ob-step::-webkit-scrollbar{display:none}
.ob-step.prev{transform:translateX(-28px)}
.ob-step.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s var(--ease) .05s,transform .6s var(--soft),visibility 0s}
.ob-step.on>*{animation:rise .7s var(--soft) both}
.ob-step.on>*:nth-child(2){animation-delay:.06s}.ob-step.on>*:nth-child(3){animation-delay:.12s}.ob-step.on>*:nth-child(4){animation-delay:.18s}.ob-step.on>*:nth-child(5){animation-delay:.24s}.ob-step.on>*:nth-child(6){animation-delay:.3s}
.ob-logo{width:64px;height:64px;border-radius:20px;background:var(--s1);border:1px solid var(--line2);display:grid;place-items:center;margin-bottom:26px;flex:none}
.ob-logo .logo{width:62%;height:62%}
.ob-h{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1.12}
.ob-p{color:var(--t2);font-size:15.5px;margin-top:10px;line-height:1.5;max-width:330px}
.ob-sp{flex:1;min-height:20px}
.ob-step .btn{margin-top:24px;flex:none}
.feats{margin-top:28px;display:grid;gap:18px}
.ft{display:flex;gap:14px;align-items:flex-start}
.ft-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);font-size:17px;color:var(--t1);flex:none}
.ft-t{font-size:15px;font-weight:600;letter-spacing:-.01em}
.ft-s{font-size:13.5px;color:var(--t2);margin-top:2px;line-height:1.45}
.logo{display:block;width:100%;height:100%}
.logo .lb{stroke:var(--ac)}
.logo.draw path{stroke-dasharray:100;animation:lgDraw 1.4s var(--soft) both}
.logo.draw path:nth-child(2){animation-delay:.4s}
@keyframes lgDraw{from{stroke-dashoffset:100}}
.ob-fine{font-size:12.5px;color:var(--t3);text-align:center;margin-top:12px}


/* ============ Store ============ */
.lv-icon{--lc:#F4F4F5;--lcg:rgba(244,244,245,.12)}

/* Page header: back to You, title, net worth */
.st-head{gap:10px;margin-bottom:18px}
.st-head h1{flex:1;min-width:0}
.st-back{margin-left:-2px;font-size:20px}
.st-bal{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.st-bal small{font-size:11.5px;color:var(--t3);font-weight:500;line-height:1}
.st-bal .odo{font-size:19px;font-weight:600;letter-spacing:-.035em}
.st-seg{margin:0 0 22px}
.st-seg button{display:flex;align-items:center;justify-content:center;gap:6px;height:32px}
.stn{font-size:11px;font-weight:600;color:var(--t3);min-width:0}
.stn:empty{display:none}
.st-body.swap>:not(.sc-list):not(.sc-grid):not(.vg){animation:rise .55s var(--soft) both}
.st-body.swap>:nth-child(2){animation-delay:.04s}.st-body.swap>:nth-child(3){animation-delay:.08s}.st-body.swap>:nth-child(n+4){animation-delay:.12s}

/* Section header inside the store */
.st-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 2px 14px}
.st-h.sm{margin-top:28px}
.st-ht{min-width:0}
.st-h h2{font-size:18px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.st-ht>span{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--t3);margin-top:4px;white-space:nowrap}
.st-ht>span .ic{font-size:13px}
.st-acts{display:flex;gap:6px;flex:none}
.mini{height:32px;padding:0 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--t2);transition:transform .25s var(--spring),background .2s}
.mini:active{transform:scale(.94);background:var(--s3)}
.mini .ic{font-size:15px}
.mini.ico{width:32px;padding:0;justify-content:center}
.chips.scroll.st-cats{margin:0 -16px 18px;padding:2px 16px}
.st-cats .chip{height:34px}

/* Highlights: saving for, today's deal */
.hl{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:28px}
.hl-card{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 12px;border-radius:20px;background:var(--s1);border:1px solid var(--line);text-align:left;position:relative;transition:transform .3s var(--ease),background .2s}
button.hl-card:active{transform:scale(.985);background:var(--s2)}
.hl-th{position:relative;width:78px;height:78px;border-radius:14px;overflow:hidden;background:var(--s2);flex:none}
.hl-th img{width:100%;height:100%;object-fit:cover;display:block}
.hl-th .ph span{font-size:24px}
.hl-m{flex:1;min-width:0}
.hl-k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--lc);white-space:nowrap}
.hl-k .ic{font-size:13px;flex:none}
.lv-common .hl-k{color:var(--t2)}
.hl-n{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-n.sm{font-size:15px;margin-top:0}
.hl-s{font-size:12.5px;color:var(--t2);margin-top:3px}
.hl-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(52,211,153,.12);color:var(--pos);font-size:19px;flex:none}
.gc-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:11px}
.gc-bar i{display:block;height:100%;border-radius:inherit;background:var(--lc);transform-origin:left;animation:mbIn 1s var(--soft) both .2s}
.gc.lv-common .gc-bar i{background:var(--ac)}
.gc-s{display:flex;gap:8px;align-items:baseline;margin-top:7px;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden}
.gc-s b{color:var(--t1);font-weight:600;flex:none}
.gc-s span{overflow:hidden;text-overflow:ellipsis}
.dl{border-color:rgba(var(--acr),.34);background:color-mix(in srgb,var(--ac) 7%,var(--s1))}
.dl .hl-k{color:var(--ac2)}
.dl-end{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--t2);font-weight:500}
.dl-end .ic{font-size:12px}
.dl-off{position:absolute;left:6px;bottom:6px;height:22px;padding:0 7px;border-radius:7px;background:var(--ac);color:var(--onac);font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:0;white-space:pre;font-variant-numeric:tabular-nums}
.dl-p{display:flex;align-items:baseline;gap:8px;margin-top:6px;white-space:nowrap}
.dl-p b{font-size:18px;font-weight:600;letter-spacing:-.03em}
.dl-p s{font-size:13px;color:var(--t3)}
.dl.unveil{opacity:0;transform:perspective(700px) rotateX(-75deg);transform-origin:50% 0}
.dl.unveil.go{opacity:1;transform:none;transition:transform .9s var(--spring),opacity .35s}
.dl.unveil.landed .dl-off{animation:offPop .55s var(--spring)}
@keyframes offPop{35%{transform:scale(1.3)}}

/* Shop cards */
.sc-list{display:flex;flex-direction:column;gap:14px}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{position:relative;display:block;width:100%;border-radius:24px;background:var(--s1);border:1px solid var(--line);overflow:hidden;text-align:left;transition:transform .4s var(--ease),border-color .3s;cursor:pointer}
.sc:active{transform:scale(.985)}
.st-body.swap .sc{animation:rise .65s var(--soft) both;animation-delay:calc(var(--i,0) * 60ms + 40ms)}
.sc.lv-epic,.sc.lv-legendary,.sc.lv-icon{border-color:color-mix(in srgb,var(--lc) 22%,var(--line))}
.sc.on-deal{border-color:rgba(var(--acr),.4)}
.sc-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--s2)}
.sc-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.001);transition:transform .9s var(--soft)}
.sc:active .sc-img img{transform:scale(1.045)}
.sc-img::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(9,9,11,.92) 0%,rgba(9,9,11,.5) 30%,rgba(9,9,11,0) 60%)}
.sc-top{position:absolute;top:12px;left:12px;right:12px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:6px}
.sc-fl{display:flex;gap:6px;min-width:0}
.sc-tier{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(9,9,11,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--lc) 32%,transparent);color:var(--lc);font-size:11.5px;font-weight:600;white-space:nowrap;flex:none}
.sc-tier i{width:6px;height:6px;border-radius:50%;background:var(--lc)}
.sc-n,.sc-tg{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:rgba(9,9,11,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:11.5px;font-weight:600;color:var(--t1);white-space:nowrap}
.sc-n .ic,.sc-tg .ic{font-size:13px;color:var(--t2)}
.sc-deal{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:var(--ac);color:var(--onac);font-size:11.5px;font-weight:700;white-space:nowrap}
.sc-deal .ic{font-size:13px}
.sc-ov{position:absolute;left:18px;right:18px;bottom:15px;z-index:2}
.sc-name{font-size:22px;font-weight:600;letter-spacing:-.032em;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc-meta{font-size:12.5px;color:rgba(250,250,250,.64);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 16px}
.sc-pr{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.sc-pr s{font-size:12.5px;color:var(--t3)}
.sc-price{font-size:20px;font-weight:600;letter-spacing:-.035em}
.sc-st{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--t2);white-space:nowrap}
.sc-st b{font-weight:600}
.sc-st .mb{width:64px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.sc-st .mb i{display:block;height:100%;border-radius:inherit;background:var(--ac);transform-origin:left;animation:mbIn 1s var(--soft) both .25s}
@keyframes mbIn{from{transform:scaleX(0)}}
.sc-st.ok{color:var(--pos)}
.sc-st.ok .mb i{background:var(--pos)}
.sc.g{border-radius:20px}
.sc.g .sc-img{aspect-ratio:1/1}
.sc.g .sc-img::after{display:none}
.sc.g .sc-top{top:8px;left:8px;right:8px}
.sc.g .sc-tier,.sc.g .sc-deal,.sc.g .sc-tg{height:22px;padding:0 8px;font-size:10.5px;gap:5px}
.sc.g .sc-tg{width:22px;padding:0;justify-content:center;font-size:0;gap:0}
.sc.g .sc-tg .ic{font-size:12px;color:var(--t1)}
.sc.g .sc-deal .ic{display:none}
.sc.g .sc-ov{position:static;padding:12px 13px 0}
.sc.g .sc-name{font-size:14.5px;letter-spacing:-.02em;-webkit-line-clamp:1}
.sc.g .sc-meta{color:var(--t3);font-size:11.5px;margin-top:2px}
.sc.g .sc-f{flex-direction:column;align-items:stretch;gap:9px;padding:8px 13px 14px}
.sc.g .sc-pr{gap:6px}
.sc.g .sc-pr s{font-size:11px}
.sc.g .sc-price{font-size:16px}
.sc.g .sc-st .mb{flex:1;width:auto}
@supports (animation-timeline:view()){
  .sc:not(.g) .sc-img img,.vh-img img{height:116%;top:-8%;animation:parx linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
}
@keyframes parx{from{transform:translateY(5%)}to{transform:translateY(-5%)}}
.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(145deg,var(--s3),var(--s1));color:var(--t3)}
.ph span{font-size:44px;font-weight:600;letter-spacing:-.04em}
.sc.g .ph span,.hr-i .ph span,.sthumb .ph span,.ph-t .ph span,.rc-th .ph span{font-size:20px}

/* Item sheet */
.sheet.item{padding-top:10px}
.it-gal{position:relative}
.it-hb{position:absolute;top:10px;right:10px;z-index:3;display:flex;gap:8px}
.ibtn.glass{background:rgba(9,9,11,.55);border-color:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.it-gal .gal-n{right:auto;left:12px}
.gal{position:relative;border-radius:22px;overflow:hidden;background:var(--s2);aspect-ratio:4/3;transform:translateZ(0)}
.gal-t{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.gal-t::-webkit-scrollbar{display:none}
.gal-s{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;cursor:zoom-in}
.gal-s img{width:100%;height:100%;object-fit:cover;display:block}
.gal-n{position:absolute;right:12px;top:12px;height:26px;padding:0 10px;border-radius:99px;background:rgba(9,9,11,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:12px;font-weight:600;display:flex;align-items:center;color:var(--t2);pointer-events:none;z-index:2}
.gal-n b{color:var(--t1);margin-right:2px;font-weight:600}
.gal-d{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.gal-d i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.4);transition:width .4s var(--soft),background .25s}
.gal-d i.on{width:18px;background:#fff}
.gal[data-n="9"] .gal-d,.gal[data-n="10"] .gal-d,.gal[data-n="11"] .gal-d,.gal[data-n="12"] .gal-d{display:none}
.it-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.it-tag{height:26px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--lcg);color:var(--lc);white-space:nowrap}
.it-tag i{width:6px;height:6px;border-radius:50%;background:var(--lc)}
.it-tag.n{background:var(--s2);color:var(--t2);border:1px solid var(--line);font-weight:500}
.it-tag .ic{font-size:13px}
.it-name{font-size:28px;font-weight:600;letter-spacing:-.04em;line-height:1.12;margin-top:12px}
.it-price{display:flex;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap}
.it-price .odo{font-size:30px;font-weight:600;letter-spacing:-.045em}
.it-unit{font-size:13px;color:var(--t3)}
.it-deal{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--ac) 9%,var(--s2));border:1px solid rgba(var(--acr),.3);font-size:12.5px;color:var(--t2);line-height:1.4}
.it-deal>.ic{font-size:19px;color:var(--ac2);flex:none}
.it-deal b{display:block;color:var(--t1);font-size:14px;font-weight:600;margin-bottom:1px}
.it-desc{margin-top:16px;font-size:15px;line-height:1.55;color:var(--t2);white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.it-card{margin-top:20px;border-radius:18px;background:var(--s2);border:1px solid var(--line);padding:16px 16px 15px}
.it-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--t2)}
.it-row b{color:var(--t1);font-weight:600;white-space:nowrap}
.it-row b.dim{color:var(--t3)}
.it-row+.it-row{margin-top:9px}
.it-card .bar{margin-top:14px}
.it-note{font-size:12.5px;color:var(--t3);margin-top:10px;line-height:1.4}
.it-note.ok{color:var(--pos)}
.it-acts{display:flex;align-items:center;gap:10px;margin-top:14px}
.it-acts:empty{display:none}
.it-own{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--t2)}
.it-own .ic{font-size:15px;color:var(--pos)}
.it-save{margin-left:auto;height:36px;padding:0 14px;border-radius:999px;background:var(--s2);border:1px solid var(--line2);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--t1);transition:background .2s,color .2s,transform .25s var(--spring)}
.it-save:active{transform:scale(.95)}
.it-save .ic{font-size:16px;color:var(--t2)}
.it-save.on{background:var(--t1);border-color:var(--t1);color:#09090B}
.it-save.on .ic{color:#09090B}
.it-buy{position:sticky;bottom:0;z-index:2;display:flex;gap:10px;align-items:center;margin:16px -20px calc(-24px - var(--safe-b));padding:14px 20px calc(20px + var(--safe-b));background:linear-gradient(to top,var(--s1) 72%,rgba(17,17,19,0))}
.qty{display:flex;align-items:center;height:52px;border-radius:16px;background:var(--s2);border:1px solid var(--line2);flex:none}
.qty button{width:42px;height:100%;display:grid;place-items:center;font-size:17px;color:var(--t1);transition:opacity .2s}
.qty button:active{opacity:.5}
.qty b{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.btn.buy{background:var(--ac);color:var(--onac)}
.btn.hold.buy{background:var(--ac);border:0;color:var(--onac)}
.btn.hold.buy .hfill{background:rgba(0,0,0,.26)}
.btn.need:disabled{opacity:1;color:var(--t3);font-size:14.5px;font-weight:500}
.it-buy .btn{flex:1;min-width:0}

/* Purchase moments */
#acquire{background:var(--bg);text-align:center}
.aq-in,.rc-in{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center}
.aq-k{font-size:12px;font-weight:600;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--lc);opacity:0;transform:translateY(8px);transition:opacity .5s .1s,transform .7s .1s var(--soft)}
#acquire.show .aq-k{opacity:1;transform:none}
.aq-card{width:100%;margin:22px 0 24px;perspective:900px;--rx:0deg;--ry:0deg;touch-action:none}
.aq-img{position:relative;width:100%;aspect-ratio:1/.9;border-radius:26px;overflow:hidden;background:var(--s2);border:1px solid var(--line2);opacity:0;transform:translateY(34px) scale(.9) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .9s var(--soft),opacity .5s,border-color .6s}
#acquire.go .aq-img{opacity:1;transform:rotateX(var(--rx)) rotateY(var(--ry))}
#acquire.spun .aq-img{border-color:color-mix(in srgb,var(--lc) 55%,transparent)}
.aq-img img{width:100%;height:100%;object-fit:cover;display:block}
.aq-shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.2) 50%,transparent 62%);transform:translateX(-130%);pointer-events:none}
#acquire.go .aq-shine{animation:shine 1.2s .6s var(--ease) forwards}
@keyframes shine{to{transform:translateX(130%)}}
.aq-name{font-size:26px;font-weight:600;letter-spacing:-.04em;line-height:1.1;opacity:0;transform:translateY(10px);transition:opacity .5s .5s,transform .7s .5s var(--soft)}
.aq-tag{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;background:var(--lcg);color:var(--lc);font-size:13px;font-weight:600;margin-top:12px;opacity:0;transform:translateY(8px);transition:opacity .5s .62s,transform .7s .62s var(--soft)}
.aq-tag i{width:6px;height:6px;border-radius:50%;background:var(--lc)}
.aq-paid{margin-top:20px;font-size:30px;justify-content:center;opacity:0;transition:opacity .4s .8s}
.aq-deal{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:500;color:var(--ac2);opacity:0;transition:opacity .4s}
.aq-deal .ic{font-size:14px}
.aq-bal{margin-top:14px;font-size:13px;color:var(--t3);opacity:0;transition:opacity .5s}
.aq-bal b{color:var(--t2);font-weight:600}
.aq-acts{width:100%;margin-top:22px;display:flex;flex-direction:column;gap:4px;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .4s,transform .6s var(--soft)}
#acquire.go .aq-name,#acquire.go .aq-tag{opacity:1;transform:none}
#acquire.go .aq-paid{opacity:1}
#acquire.spun .aq-deal{opacity:1}
#acquire.landed .aq-bal{opacity:1}
#acquire.landed .aq-acts{opacity:1;transform:none;pointer-events:auto}
#acquire .lk{margin-top:18px}
.lk{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:var(--lcg);border:1px solid color-mix(in srgb,var(--lc) 32%,transparent);opacity:0;transform:translateY(10px) scale(.96);transition:opacity .35s,transform .55s var(--spring);text-align:left}
.lk.in{opacity:1;transform:none}
.lk.landed{animation:thud .45s var(--ease)}
.lk-l{display:flex;align-items:center;gap:11px;min-width:0}
.lk-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--lc) 18%,transparent);color:var(--lc);font-size:17px;flex:none}
.lk-l>div>b{display:block;font-size:14px;font-weight:600;color:var(--t1)}
.lk-l>div>span{display:block;font-size:12px;color:var(--t2);margin-top:1px}
.lk-a{font-size:19px;color:var(--lc);flex:none}
/* Receipt (unlimited items) */
.rc-card{width:100%;margin:22px 0 2px;opacity:0;transform:translateY(46px);transition:transform .75s var(--soft),opacity .3s}
#acquire.go .rc-card{opacity:1;transform:none}
.rc-paper{position:relative;padding:18px 18px 18px;border-radius:24px;background:var(--s1);border:1px solid var(--line2);text-align:left;clip-path:inset(0 0 100% 0 round 24px);transition:clip-path 1s cubic-bezier(.5,0,.2,1) .12s}
#acquire.go .rc-paper{clip-path:inset(0 0 0 0 round 24px)}
.rc-item{display:flex;align-items:center;gap:13px}
.rc-th{width:54px;height:54px;border-radius:15px;overflow:hidden;background:var(--s2);flex:none}
.rc-th img{width:100%;height:100%;object-fit:cover;display:block}
.rc-im{min-width:0}
.rc-n{font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-s{font-size:12.5px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-sep{position:relative;height:0;margin:18px -18px 16px;border-top:1.5px dashed var(--line3)}
.rc-sep::before,.rc-sep::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.rc-sep::before{left:-9px}.rc-sep::after{right:-9px}
.rc-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--t2)}
.rc-row+.rc-row{margin-top:10px}
.rc-row b{color:var(--t1);font-weight:600;white-space:nowrap}
.rc-row.ok span,.rc-row.ok b{color:var(--pos)}
.rc-row.tot{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--t1);font-weight:500}
.rc-row.tot .amt-roll{font-size:28px}
.rc-paper .lk{margin-top:16px}

/* Collection */
.vs{padding:18px 18px 18px;border-radius:22px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.vs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.vs-m{min-width:0}
.vs-k{font-size:13px;color:var(--t2)}
.vs-v{font-size:32px;font-weight:600;letter-spacing:-.045em;margin-top:6px}
.vs-n{text-align:right;flex:none;padding-top:1px}
.vs-n b{display:block;font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.vs-n span{display:block;font-size:12px;color:var(--t3);margin-top:2px}
.vs-lv{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 9px 0 10px;margin-top:14px;border-radius:999px;background:var(--s2);border:1px solid var(--line2);font-size:12.5px;font-weight:500;color:var(--t1);transition:transform .25s var(--spring)}
.vs-lv:active{transform:scale(.95)}
.vs-lv .ic{font-size:14px;color:var(--t2)}
.vs-bar{display:flex;gap:3px;height:6px;margin-top:18px}
.vs-bar i{display:block;border-radius:6px;background:var(--c);flex:var(--g) 1 0;min-width:6px;transform-origin:left;animation:mbIn 1s var(--soft) both .2s}
.vs-leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12px;color:var(--t2)}
.vs-leg span{display:inline-flex;align-items:center;gap:6px}
.vs-leg b{font-weight:500;color:var(--t3);margin-left:2px}
.vh{position:relative;display:block;width:100%;border-radius:26px;overflow:hidden;aspect-ratio:1/1.1;background:var(--s2);border:1px solid color-mix(in srgb,var(--lc) 26%,var(--line));text-align:left;--rx:0deg;--ry:0deg;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s var(--ease)}
.vh:active{transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) scale(.99)}
.vh-img{position:absolute;inset:0;overflow:hidden}
.vh-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vh::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(9,9,11,.94) 0%,rgba(9,9,11,.55) 30%,rgba(9,9,11,0) 58%)}
.vh-top{position:absolute;top:14px;left:14px;right:14px;z-index:2;display:flex;justify-content:space-between;align-items:center}
.vh-b{position:absolute;left:20px;right:20px;bottom:20px;z-index:2}
.vh-no{font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--lc)}
.vh-name{font-size:30px;font-weight:600;letter-spacing:-.042em;line-height:1.06;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vh-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px;font-size:12.5px;color:rgba(250,250,250,.66)}
.vh-price{font-size:21px;font-weight:600;color:var(--t1);letter-spacing:-.03em}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
