.vt{position:relative;display:block;width:100%;border-radius:20px;overflow:hidden;aspect-ratio:4/5;background:var(--s2);border:1px solid color-mix(in srgb,var(--lc) 20%,var(--line));text-align:left;transition:transform .4s var(--ease)}
.vt:active{transform:scale(.98)}
.st-body.swap .vt{animation:rise .65s var(--soft) both;animation-delay:calc(var(--i,0) * 55ms + 120ms)}
.vt-img{position:absolute;inset:0}
.vt-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--soft)}
.vt:active .vt-img img{transform:scale(1.05)}
.vt::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(9,9,11,.92) 0%,rgba(9,9,11,.4) 36%,rgba(9,9,11,0) 62%)}
.vt-no{position:absolute;top:12px;left:14px;z-index:2;font-size:12px;font-weight:600;letter-spacing:.08em;color:rgba(250,250,250,.8);font-variant-numeric:tabular-nums}
.vt-b{position:absolute;left:14px;right:14px;bottom:13px;z-index:2}
.vt-name{font-size:14.5px;font-weight:600;letter-spacing:-.02em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vt-price{font-size:12.5px;color:var(--lc);font-weight:600;margin-top:4px}
.vt.lv-common .vt-price{color:var(--t2)}

/* History */
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.hs>div{padding:13px 14px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);min-width:0}
.hs small{display:block;font-size:12px;color:var(--t2)}
.hs b{display:block;font-size:17px;font-weight:600;letter-spacing:-.03em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs .hs-sv b{color:var(--pos)}
.chips.scroll.hf{margin:0 -16px 18px;padding:2px 16px}
.hl-list .lday:first-child{border-top:0}
.hl-list .lday{padding:14px 16px 6px}
.hr{display:flex;align-items:center;gap:13px;width:100%;padding:12px 16px;text-align:left;transition:background .2s}
.hr:active{background:var(--s2)}
.hr+.hr{border-top:1px solid var(--line)}
.hr-i{width:48px;height:48px;border-radius:14px;overflow:hidden;background:var(--s2);flex:none}
.hr-i img{width:100%;height:100%;object-fit:cover;display:block}
.hr-m{flex:1;min-width:0}
.hr-t{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr-t em{font-style:normal;color:var(--t3);margin-left:6px;font-weight:500}
.hr-s{font-size:12.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hr-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.hr-a{font-size:14.5px;font-weight:600;white-space:nowrap}
.hr-x{font-size:11.5px;font-weight:600;white-space:nowrap}
.hr-x.deal{color:var(--ac2)}.hr-x.back{color:var(--pos)}
.st-empty{margin-top:4px;border-radius:22px;background:var(--s1);border:1px solid var(--line);padding:32px 22px 26px}

/* Store on the You page */
.ys{border-radius:22px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.ys-hero{position:relative;display:block;width:100%;aspect-ratio:16/8.5;overflow:hidden;background:var(--s2);text-align:left}
.ys-img{position:absolute;inset:0}
.ys-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--soft)}
.ys-hero:active .ys-img img{transform:scale(1.04)}
.ys-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(9,9,11,.94) 0%,rgba(9,9,11,.5) 42%,rgba(9,9,11,0) 72%)}
.ys-ov{position:absolute;left:16px;right:16px;bottom:15px;z-index:2;display:flex;flex-direction:column;min-width:0}
.ys-k{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--lc)}
.ys-k .ic{font-size:13px}
.ys-hero.lv-common .ys-k{color:var(--t1)}
.ys-n{font-size:20px;font-weight:600;letter-spacing:-.03em;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ys-s{font-size:12.5px;color:rgba(250,250,250,.7);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ys-bar{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.16);margin-top:11px;overflow:hidden}
.ys-bar i{display:block;height:100%;border-radius:inherit;background:var(--lc)}
.ys-hero.lv-common .ys-bar i{background:var(--ac)}
.ys-row{display:grid;grid-template-columns:repeat(3,1fr)}
.ys-row button{padding:13px 16px 14px;text-align:left;transition:background .2s;min-width:0}
.ys-row button+button{border-left:1px solid var(--line)}
.ys-row button:active{background:var(--s2)}
.ys-row b{display:block;font-size:17px;font-weight:600;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ys-row span{display:block;font-size:12px;color:var(--t2);margin-top:2px;white-space:nowrap}
.ys-empty{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:22px;background:var(--s1);border:1px solid var(--line);text-align:left;color:var(--t3);transition:background .2s}
.ys-empty:active{background:var(--s2)}
.ys-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s3);color:var(--t1);font-size:20px;flex:none}
.ys-em{flex:1;min-width:0}
.ys-em b{display:block;font-size:15px;font-weight:600;color:var(--t1)}
.ys-em span{display:block;font-size:13px;color:var(--t2);margin-top:2px;line-height:1.4}

/* Item editor */
.ed-sheet .sh-head{margin-bottom:2px}
.ef{margin-top:24px}
.ef>.lbl{margin:0 3px 10px}
.ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph-t{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--s2);border:1px solid var(--line2);cursor:pointer;animation:enter .4s var(--soft) both}
.ph-t img{width:100%;height:100%;object-fit:cover;display:block}
.ph-t.cover{border-color:var(--t1)}
.ph-cv{position:absolute;left:5px;bottom:5px;height:18px;padding:0 7px;border-radius:99px;background:var(--t1);color:#09090B;font-size:10px;font-weight:700;display:flex;align-items:center}
.ph-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(9,9,11,.72);display:grid;place-items:center;font-size:12px;color:var(--t1)}
.ph-x::before{content:"";position:absolute;inset:-8px}
.ph-t.busy{cursor:default;background:linear-gradient(100deg,var(--s2) 30%,var(--s3) 50%,var(--s2) 70%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.ph-add{aspect-ratio:1;border-radius:14px;border:1.5px dashed var(--line3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--t2);font-size:11.5px;font-weight:500;transition:background .2s,transform .25s var(--spring)}
.ph-add:active{background:var(--s2);transform:scale(.96)}
.ph-add .ic{font-size:19px}
.ph-hint{font-size:12px;color:var(--t3);margin:10px 3px 0;line-height:1.4}
.lnk-row{display:none;gap:8px;margin-top:12px}
.lnk-row.on{display:flex}
.lnk-row .field{height:46px;font-size:15px}
.lnk-row .btn{width:84px;height:46px;border-radius:13px;flex:none}
.fpre{display:flex;align-items:center;height:52px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);padding:0 16px;gap:8px;transition:border-color .2s}
.fpre:focus-within{border-color:var(--line3)}
.fpre span{color:var(--t3);font-size:17px}
.fpre input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;font-size:17px}
textarea.field{height:auto;min-height:112px;padding:14px 16px;line-height:1.5;resize:none;display:block;font-family:inherit}
.tag-hint{font-size:12px;font-weight:600;color:var(--lc);display:inline-flex;align-items:center;gap:6px}
.tag-hint .pf{color:var(--t2);font-weight:500;margin-right:4px}
.tag-hint i{width:6px;height:6px;border-radius:50%;background:var(--lc)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind button{padding:14px 14px 15px;border-radius:16px;background:var(--s2);border:1px solid var(--line2);text-align:left;display:flex;flex-direction:column;gap:3px;transition:border-color .2s,background .2s,transform .25s var(--spring)}
.kind button:active{transform:scale(.97)}
.kind .ic{font-size:19px;color:var(--t3);margin-bottom:8px;transition:color .2s}
.kind b{font-size:14.5px;font-weight:600}
.kind span{font-size:12px;color:var(--t3);line-height:1.35}
.kind button.on{border-color:var(--t1);background:var(--s3)}
.kind button.on .ic{color:var(--t1)}
.chips.scroll.cat-chips{margin:12px -20px 0;padding:2px 20px}
.cat-chips .chip{height:30px;padding:0 12px;font-size:12.5px}
.ed-sheet .sh-actions{margin-top:28px}
.wide .sin input{width:150px}
.sthumb{width:44px;height:44px;border-radius:12px;overflow:hidden;background:var(--s3);flex:none}
.sthumb img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shk{animation:shk .35s var(--ease)}

/* Lightbox */
.lbx{position:absolute;inset:0;z-index:350;background:#000;opacity:0;transition:opacity .3s}
.lbx.in{opacity:1}
.lbx-t{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lbx-t::-webkit-scrollbar{display:none}
.lbx-s{flex:0 0 100%;height:100%;display:grid;place-items:center;scroll-snap-align:center;scroll-snap-stop:always}
.lbx-s img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lbx-x{position:absolute;top:calc(var(--top) + 4px);right:16px;background:rgba(24,24,27,.8)}
.lbx-n{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 26px);text-align:center;font-size:13px;font-weight:600;color:var(--t2);pointer-events:none}
.lbx-n b{color:var(--t1)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}
}
#app.rm *,#app.rm *::before,#app.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.12s!important}
</style>
</head>
<body>
<div id="app" class="onb" data-isl="idle">
  <main class="views">
    <!-- TODAY -->
    <section class="view active" id="v-today">
      <header class="hdr rise" style="--i:0">
        <button class="me" id="meBtn" aria-label="You"><svg viewBox="0 0 44 44"><circle class="t" cx="22" cy="22" r="21"/><circle class="p" id="meP" cx="22" cy="22" r="21" stroke-dasharray="131.95" stroke-dashoffset="131.95"/></svg><span id="meI">A</span><i class="dot"></i></button>
        <div class="hdr-m"><div class="hello" id="greet"></div><div class="hsub" id="hsub"></div></div>
      </header>
      <div class="card hero rise" style="--i:1" id="hero">
        <div class="h-top"><span>Net worth</span><span class="live"><i></i><span id="liveT">0:00</span></span></div>
        <div class="h-amt odo" id="hAmt"></div>
        <div><span class="h-delta" id="hDelta"></span></div>
        <button class="h-goal" id="hGoal"><div class="hm-row"><span id="hmL"></span><b id="hmR"></b></div><div class="bar"><i id="hmBar" style="width:0"></i></div></button>
      </div>
      <div id="installBanner"></div>
      <div class="tiles rise" style="--i:2">
        <button class="tile" id="tlTasks"><div class="tl-k" data-ic="check">Tasks</div><div class="tl-v" id="tlTV"></div><div class="tl-s" id="tlTS"></div><div class="bar"><i id="tlTB" style="width:0;background:var(--pos)"></i></div></button>
        <button class="tile" id="tlFocus"><div class="tl-k" data-ic="clock">Focus</div><div class="tl-v" id="tlFV"></div><div class="tl-s" id="tlFS"></div><div class="bar"><i id="tlFB" style="width:0"></i></div></button>
        <button class="tile" id="tlStreak"><div class="tl-k" data-ic="flame">Streak</div><div class="tl-v" id="tlSV"></div><div class="tl-s" id="tlSS"></div><div class="bar"><i id="tlSB" style="width:0;background:var(--fire)"></i></div></button>
      </div>
      <div class="sec rise" style="--i:3" id="todaySec"><h2>Today</h2><span class="cnt" id="taskCnt"></span><button class="ibtn sm" id="btnAdd" aria-label="Add task" data-ic="plus"></button></div>
      <div class="list rise" style="--i:4" id="taskList"></div>
      <div class="hint-swipe rise" style="--i:5" id="swipeHint">Swipe right to complete · left to move to tomorrow</div>
      <button class="peek rise" style="--i:5" id="peek"></button>
    </section>

    <!-- PLAN -->
    <section class="view" id="v-plan">
      <div class="vhead rise" style="--i:0"><h1>Plan</h1><button class="pill" id="planToday">Today</button></div>
      <div class="card cal rise" style="--i:1">
        <div class="cal-h"><button class="ibtn sm" id="calPrev" aria-label="Previous month" data-ic="chevL"></button><div class="cal-m" id="calM"></div><button class="ibtn sm" id="calNext" aria-label="Next month" data-ic="chev"></button></div>
        <div class="cal-w"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
        <div class="cal-gw" id="calGw"><i class="cal-sel" id="calSel"></i><div class="cal-g" id="calG"></div></div>
      </div>
      <div class="dayh rise" style="--i:2"><div class="m"><h2 id="dayT"></h2><div class="s" id="dayS"></div></div><button class="ibtn" id="dayAdd" aria-label="Add task for this day" data-ic="plus"></button></div>
      <div class="list rise" style="--i:3" id="dayList"></div>
      <div class="sec rise" style="--i:4"><h2>Repeating</h2><span class="cnt" id="rtCnt"></span></div>
      <div class="list rise" style="--i:5" id="rtList"></div>
    </section>

    <!-- FOCUS -->
    <section class="view" id="v-focus">
      <div class="vhead rise" style="--i:0"><h1>Focus</h1><button class="pill" id="ambBtn"></button></div>
      <div class="ring-wrap rise" style="--i:1">
        <svg class="ring" viewBox="0 0 300 300">
          <circle class="ring-track" cx="150" cy="150" r="140"/>
          <circle class="ring-prog" id="ringProg" cx="150" cy="150" r="140" stroke-dasharray="879.6" stroke-dashoffset="879.6"/>
        </svg>
        <div class="ring-c">
          <div class="rc-l" id="rcL">Ready</div>
          <div class="rc-t odo" id="rcT"></div>
          <div class="rc-e" id="rcE"></div>
          <div class="rc-m" id="rcM">×1.00</div>
        </div>
      </div>
      <div class="sgoal rise" style="--i:2" id="sgoal"></div>
      <div class="card finfo rise" style="--i:3" id="finfo"></div>
      <div class="fbtns rise" style="--i:4" id="fBtns"></div>
      <div class="hint rise" style="--i:5" id="fHint"></div>
    </section>

    <!-- STORE -->
    <section class="view" id="v-store">
      <div class="vhead st-head rise" style="--i:0"><button class="ibtn st-back" id="stBack" aria-label="Back to You" data-ic="chevL"></button><h1>Store</h1><div class="st-bal" id="stBal"><small>Net worth</small><span class="odo" id="stBalV"></span></div></div>
      <div class="seg st-seg rise" style="--i:1" id="stSeg"><div class="seg-ind"></div><button data-t="shop" class="on">Shop</button><button data-t="vault">Collection<b class="stn" id="stVn"></b></button><button data-t="hist">History</button></div>
      <div id="stBody"></div>
    </section>

    <!-- STATS -->
    <section class="view" id="v-stats">
      <div class="vhead rise" style="--i:0"><h1>Stats</h1></div>
      <div class="card chart-card rise" style="--i:1">
        <div class="cc-h"><div><div class="cc-k">Net worth</div><div class="cc-v" id="ccV"></div><div class="cc-c" id="ccC"></div></div></div>
        <div class="chart" id="chart"></div>
        <div class="seg" id="rangeSeg"><div class="seg-ind"></div><button data-r="7" class="on">Week</button><button data-r="30">Month</button><button data-r="0">All</button></div>
      </div>
      <div class="card heat-card rise" style="--i:2"><div class="w-h"><h3>Focus history</h3><span id="heatBest"></span></div><div class="heat" id="heat"></div><div class="heat-leg"><span id="heatTot"></span><span>Less<i></i><i style="background:rgba(var(--acr),.22)"></i><i style="background:rgba(var(--acr),.45)"></i><i style="background:rgba(var(--acr),.7)"></i><i style="background:var(--ac)"></i>More</span></div></div>
      <div class="stats rise" style="--i:3" id="stats"></div>
      <div class="card week rise" style="--i:4"><div class="w-h"><h3>Focus this week</h3><span id="wkTot"></span></div><div class="bars" id="bars"></div></div>
      <div class="sec rise" style="--i:5"><h2>Activity</h2><span class="cnt"></span><button class="lnk" id="allAct">See all</button></div>
      <div class="list rise" style="--i:6" id="activity"></div>
    </section>

    <!-- YOU -->
    <section class="view" id="v-you">
      <div class="vhead rise" style="--i:0"><h1>You</h1><button class="ibtn" id="youSet" aria-label="Settings" data-ic="gear"></button></div>
      <div class="card prof rise" style="--i:1" id="prof"></div>

/* ================= Ledger & progress engine ================= */
function credit(amount,{kind='task',label='',tier='',level='',ts=now(),day=null,typeId=null}={}){
 amount=r2(amount);if(!amount)return;
 S.balance=r2(S.balance+amount);
 const d=ensureDay(day||S.dayKey);
 if(amount>0){S.earned+=amount;d.earned+=amount}else{S.lost+=-amount;d.lost+=-amount}
 d.nw=S.balance;
 S.byKind[kind]=(S.byKind[kind]||0)+amount;
 if(typeId)S.byType[typeId]=(S.byType[typeId]||0)+amount;
 S.ledger.unshift({id:uid(),ts,kind,label,amount,tier,level});
 if(S.ledger.length>1000)S.ledger.length=1000;
 save();checkProgress();storeWatch();if(cur==='store')setStBal();
}
let inCheck=false,again=false;
function checkProgress(){
 if(!S.onboarded||!S.dayKey)return;if(inCheck){again=true;return}inCheck=true;
 try{let guard=0;do{again=false;guard++;
  S.peak=Math.max(S.peak||0,netWorth());
  const ri=rankIdx(S.peak);let promoted=null;
  if(ri>(S.rank||0)){S.rank=ri;promoted=rankAt(ri)}
  ensureGoals();let wealthHit=null;
  for(const cat of Object.keys(GOALS)){
   const def=GOALS[cat],g=S.goals[cat],v=def.cur();
   if(v>=g.target){const bonus=r2(def.bonus(g));S.msLog.unshift({cat,target:g.target,ts:now(),bonus});if(S.msLog.length>400)S.msLog.length=400;
    S.goals[cat]=newGoal(cat);
    if(cat==='wealth')wealthHit={g,bonus,next:S.goals[cat]};
    else{Note.alert({t1:'Goal reached',t2:def.name(g.target),amt:bonus?'+'+kshort(bonus):'',lv:def.lv,icon:def.icon,dur:3200});setTimeout(()=>{Snd.milestone();FX.at($('#note'),{n:24,colors:LVCOL[def.lv],speed:6,angle:Math.PI/2,spread:Math.PI*1.2,gravity:.14})},250)}
    if(bonus)credit(bonus,{kind:'bonus',label:def.name(g.target)+' bonus',level:'legendary'});
   }else if(cat!=='streak'&&now()-g.setAt>Math.max(3,num(S.settings.goals.horizon)*3)*864e5){S.goals[cat]=newGoal(cat)}
  }
  if(promoted||wealthHit){const p=promoted,w=wealthHit;
   enqueue(()=>celebrate({lv:'accent',glyph:p?'medal':'wallet',kicker:p?'Promotion':'Goal reached',title:p?p.name:wealthName(w.g.target),amount:w&&w.bonus?`+${money(w.bonus)} bonus`:'',
    sub:p?`Your net worth passed ${money(p.at)}.${w?` Next goal: <b>${esc(wealthName(w.next.target))}</b>.`:''}`:`Next goal: <b>${esc(wealthName(w.next.target))}</b>.`,big:true}))}
  for(const b of BADGES){const had=S.badges[b.id]||0,L=bLevelUp(b);if(L){const bonus=r2(num(S.settings.badges.bonus)*L);if(!S.newBadges.includes(b.id))S.newBadges.push(b.id);
    Note.alert({t1:had===0?'Badge unlocked':'Badge levelled up',t2:`${b.name} · Level ${L}`,amt:bonus?'+'+kshort(bonus):'',lv:tierLv(L),icon:b.icon,em:emblem(b.id,L,0,40),dur:3200});setTimeout(()=>Snd.milestone(),200);
    if(bonus)credit(bonus,{kind:'bonus',label:`${b.name} level ${L}`,level:'legendary'})}}
 }while(again&&guard<10)}finally{inCheck=false}
 save();
}
/* Daily focus: every hour pays more, and beating your best day pays a bonus. No fixed target. */
function checkFocusDay(t=now()){
 if(!S.onboarded||!S.dayKey)return;const d=D(),tf=todayFocus(t),h=Math.floor(tf/3600);d.hrs=d.hrs||0;let c=0,changed=false;
 while(d.hrs<h&&c<30){d.hrs++;c++;changed=true;const n=d.hrs,b=hourBonus(n);
  Note.alert({t1:`Hour ${n} of focus today`,t2:`Hour ${n+1} pays ${kshort(hourBonus(n+1))}`,amt:b?'+'+kshort(b):'',lv:'focus',icon:'clock',dur:3000});
  setTimeout(()=>{Snd.milestone();haptic([20,40,20])},150);
  if(b)credit(b,{kind:'bonus',label:`Hour ${n} of focus today`,level:'rare'})}
 const best=bestDay();
 if(!d.rec&&best>=3600&&tf>best){d.rec=true;changed=true;S.stats.records=(S.stats.records||0)+1;const b=num(F().recordBonus);
  Note.alert({t1:'New personal best',t2:`More than ${dur(best)} focused today`,amt:b?'+'+kshort(b):'',lv:'legendary',icon:'trophy',dur:3600});
  setTimeout(()=>{Snd.fanfare();haptic([30,50,30,50,90]);FX.at($('#note'),{n:40,colors:LVCOL.legendary,speed:7,angle:Math.PI/2,spread:Math.PI*1.2,gravity:.14})},200);
  if(b)credit(b,{kind:'bonus',label:'New personal best',level:'legendary'});else checkProgress()}
 if(changed){save();if(cur==='today')renderTiles(t)}
}

 }
 build(str,old,instant){
  const chars=[...str],decAt=this.money?str.lastIndexOf('.'):-1,cur=S.profile.currency;
  const od=old?[...old].filter(c=>/\d/.test(c)):[],nd=chars.filter(c=>/\d/.test(c));let di=0;
  let h='';chars.forEach((ch,i)=>{const dec=decAt>=0&&i>decAt?' dec':'';
   if(/\d/.test(ch)){const k=od.length-(nd.length-di);const start=instant?ch:(k>=0?od[k]:'0');di++;
    h+=`<span class="od${dec}"><span class="odc" style="--d:${start};transition-delay:${this.money?i*16:0}ms">${'0123456789'.split('').map(x=>`<span>${x}</span>`).join('')}</span></span>`}
   else h+=`<span class="os${dec}${this.money&&(ch===cur||(ch==='−'&&i===0))?' cur':''}">${ch}</span>`});
  this.el.innerHTML=h;this.cols=[];const kids=this.el.children;chars.forEach((ch,i)=>{this.cols[i]=/\d/.test(ch)?kids[i].firstChild:null});
  if(!instant){void this.el.offsetWidth;requestAnimationFrame(()=>chars.forEach((ch,i)=>{if(this.cols[i])this.cols[i].style.setProperty('--d',ch)}))}

}

 const el=$('#celebrate');el.className='overlay lv-'+(o.lv||'accent');

  <div class="cb-ic">${ic(o.glyph||'spark')}</div>

  ${o.amount?`<div class="cb-a" style="--d:3">${o.amount}</div>`:''}${o.sub?`<div class="cb-s" style="--d:4">${o.sub}</div>`:''}
  <button class="btn primary cb-btn" style="--d:5">${o.cta||'Continue'}</button></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
 setTimeout(()=>{const cols=LVCOL[o.lv]||LVCOL.accent;if(!o.quiet){FX.at(el.querySelector('.cb-ic'),{n:o.big?60:36,colors:cols,speed:8});if(o.big)FX.rain(50,cols)}o.quiet?Snd.milestone():Snd.fanfare();haptic([20,40,20,40,80])},250);
 let done=false;el.querySelector('.cb-btn').addEventListener('click',()=>{if(done)return;done=true;el.classList.remove('show');setTimeout(()=>{renderAll();res()},320)});
})}

/* ================= Focus session ================= */
let wl=null;
async function wake(){try{if('wakeLock' in navigator&&S.session&&!document.hidden&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
function unwake(){try{wl&&wl.release()}catch(e){}wl=null}
function startFocus(src){
 if(S.session){go('focus');return}
 const hr=new Date().getHours();
 S.session={start:now(),lastConfirm:now(),drops:0,dropTotal:0,goal:num(F().lastGoal),goalHit:false};S.stats.sessions++;if(hr<8&&hr>=4)S.stats.early++;if(hr>=22||hr<4)S.stats.night++;saveNow();
 document.body.classList.add('focusing');Snd.start();haptic([12,40,24]);wake();
 if(S.settings.ambience!=='off')Snd.ambStart(S.settings.ambience);
 Note.alert({t1:'Focus started',t2:S.session.goal?`Session goal ${dur(S.session.goal*60)}`:`Earning ${kshort(num(F().rate))}/h and rising`,amt:'×1.00',lv:'focus',icon:'bolt',dur:2200});
 renderTiles();renderOrb();if(cur==='focus')renderFocusView();checkProgress();
}
function awardDrop(ts=now()){
 const s=S.session;s.drops++;S.stats.drops++;
 const tiers=S.settings.focusTiers,tier=rollTier(tiers),lv=tierLevel(tier,tiers),amt=r2(rollAmt(tier)*streakMult());
 s.dropTotal=r2((s.dropTotal||0)+amt);
 if(lv==='legendary'){S.stats.legendary++;payout({amount:amt,tierName:tier.name,level:lv,title:`Bonus #${s.drops} while focusing`,kicker:'Focus bonus'})}
 else{Note.alert({t1:`Focus bonus · ${tier.name}`,t2:'Keep going',amt:'+'+money(amt,{compact:amt>=1e5}),lv,icon:'bolt'});
  lv==='epic'?Snd.land('epic'):Snd.drop();haptic([15,30,15]);if(lv!=='common')FX.at($('#note'),{n:lv==='epic'?36:18,colors:LVCOL[lv],speed:6,angle:Math.PI/2,spread:Math.PI*1.2,gravity:.14})}
 credit(amt,{kind:'drop',label:'Focus bonus',tier:tier.name,level:lv,ts});
}
function focusTick(t){
 const s=S.session;if(!s)return;const f=F();
 if(f.checkIn){const due=s.lastConfirm+Math.max(5,num(f.checkInEvery))*60000;
  if(t>due+5*60000){endSession(due,{auto:true});return}
  if(t>=due&&!ciOpen)openCheckin(due);if(ciOpen)updateCheckin(t)}
 const n=Math.floor(sessSec(t)/(Math.max(1,num(f.dropEvery))*60));let c=0;while(s.drops<n&&c<50){awardDrop(t);c++}
 if(s.goal&&!s.goalHit&&sessSec(t)>=s.goal*60){s.goalHit=true;const b=r2(Math.max(1000,payFor(s.goal*60)*num(f.goalBonusPct)/100));
  Note.alert({t1:'Session goal reached',t2:`${dur(s.goal*60)} focused`,amt:'+'+kshort(b),lv:'focus',icon:'target',dur:3000});Snd.milestone();haptic([20,40,20]);
  credit(b,{kind:'bonus',label:`Session goal · ${dur(s.goal*60)}`,level:'legendary'});if(cur==='focus')renderFocusView()}
 checkFocusDay(t);
}
function endSession(endTs=now(),{auto=false}={}){
 const s=S.session;if(!s)return;endTs=Math.max(s.start,endTs);
 const f=F(),sec=Math.max(0,(endTs-s.start)/1000),n=Math.floor(sec/(Math.max(1,num(f.dropEvery))*60));
 let c=0;while(s.drops<n&&c<50){awardDrop(endTs);c++}
 const pay=r2(payFor(sec));S.session=null;
 addFocus(s.start,endTs);S.stats.focusSec+=sec;S.stats.longest=Math.max(S.stats.longest,sec);
 if(pay>0)credit(pay,{kind:'focus',label:`Focus session · ${dur(sec)}`,level:'common',ts:endTs});
 S.sessions.unshift({start:s.start,end:endTs,sec,pay,drops:s.drops,dropTotal:s.dropTotal||0,goal:s.goal,goalHit:s.goalHit});if(S.sessions.length>300)S.sessions.length=300;
 closeCheckin();unwake();Snd.ambStop();document.body.classList.remove('focusing');saveNow();Snd.stop();
 checkFocusDay();checkProgress();renderAll();
 const tf=todayFocus(),best=bestDay();
 if(sec>=60||auto)enqueue(()=>celebrate({lv:'focus',glyph:'clock',quiet:true,kicker:auto?'Session ended at your last check-in':'Session complete',title:dur(sec),amount:'+'+money(pay+(s.dropTotal||0)),
  sub:auto?'You missed a check-in, so time after it was not counted.':`<b>${dur(tf,true)}</b> focused today.${best>=3600?(tf>best?' That beats your best day.':` Your best day is ${dur(best)}.`):''}`,cta:'Done'}));
}
function askStop(){
 if(!S.session)return;const f=F(),sec=sessSec(),dE=Math.max(1,num(f.dropEvery))*60,left=dE-sec%dE,m=sessMult(sec),s=S.session,tf=todayFocus(),hn=Math.floor(tf/3600)+1,hl=hn*3600-tf;
 haptic([20,30,20]);
 const goalLeft=s.goal&&!s.goalHit?s.goal*60-sec:0;
 const sh=openSheet({html:`<div class="stop stag"><h3>End this session?</h3>
 <p>${goalLeft>0?`You're <b>${durS(goalLeft)}</b> from your session goal. `:''}Hour ${hn} pays <b>+${kshort(hourBonus(hn))}</b> in <b>${durS(hl)}</b>, and your next bonus lands in <b>${durS(left)}</b>.${m>1.005?` Your <b>×${m.toFixed(2)}</b> rate resets when you stop.`:''}</p>
 <div class="stop-k"><div><span>Time</span><b>${clock(sec)}</b></div><div><span>Earned</span><b style="color:var(--pos)">${money(pending()+(s.dropTotal||0),{compact:true})}</b></div></div>
 <button class="btn primary" data-x="keep">Keep focusing</button>
 ${holdBtn('Hold to end','holdEnd')}</div>`});
 holdable($('#holdEnd',sh.sheet),1500,()=>{sh.close();setTimeout(()=>endSession(now()),250)});
 sh.sheet.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;
  if(b.dataset.x==='keep'){sh.close();Snd.coin();Note.alert({t1:'Good call',t2:`Hour ${hn} in ${durS(hl)}`,amt:'×'+m.toFixed(2),lv:'focus',icon:'bolt',dur:2200})}});
}
const holdBtn=(label,id,style='margin-top:8px')=>`<button class="btn hold" id="${id}" style="${style}"><i class="hfill"></i><span class="htx"><b class="h1">${label}</b><b class="h2">Keep holding…</b></span></button>`;
function holdable(btn,ms,cb){
 let raf=0,t0=0,prog=0,lastQ=0,down=false;const fill=btn.querySelector('.hfill');
 const step=()=>{raf=0;if(!down||!btn.isConnected){reset();return}
  prog=clamp((performance.now()-t0)/ms,0,1);fill.style.transform=`scaleX(${prog})`;const q=Math.floor(prog*8);if(q!==lastQ){lastQ=q;haptic(6)}
  if(prog>=1){down=false;reset();Snd.holdStop();cb();return}raf=requestAnimationFrame(step)};
 const reset=()=>{if(raf)cancelAnimationFrame(raf);raf=0;btn.classList.remove('holding');fill.style.transition='transform .4s var(--ease)';fill.style.transform='scaleX(0)';setTimeout(()=>fill.style.transition='',420);prog=0;lastQ=0};
 const start=e=>{if(down)return;if(e.cancelable)e.preventDefault();down=true;t0=performance.now();fill.style.transition='none';btn.classList.add('holding');haptic(10);Snd.holdStart(ms);if(!raf)raf=requestAnimationFrame(step)};
 const stop=()=>{if(!down)return;down=false;Snd.holdStop();reset()};
 btn.addEventListener('pointerdown',start);['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,stop));btn.addEventListener('contextmenu',e=>e.preventDefault());
}
let ciOpen=false,ciDue=0;
function openCheckin(due){
 ciOpen=true;ciDue=due;const el=$('#checkin'),bonus=r2(num(F().rate)*num(F().checkInBonusPct)/100);
 el.innerHTML=`<div class="ci"><div class="ci-ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" stroke="rgba(255,255,255,.07)"/><circle id="ciP" cx="48" cy="48" r="44" style="stroke:var(--ac)" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="ci-t" id="ciT">5:00</div></div>
 <h3>Still focusing?</h3><p>Tap to keep this session running.${bonus?` You'll get ${money(bonus)} for checking in.`:''}</p><button class="btn primary" id="ciYes">${ic('hand')}I'm here</button></div>`;
 el.classList.add('show');Snd.ping();haptic([40,80,40]);updateCheckin(now());
 $('#ciYes').addEventListener('click',()=>{if(!S.session)return;S.session.lastConfirm=now();closeCheckin();if(bonus)credit(bonus,{kind:'checkin',label:'Check-in bonus',level:'rare'});
  Snd.coin();Note.alert({t1:'Checked in',t2:'Session still running',amt:bonus?'+'+money(bonus):'',lv:'rare',icon:'hand',dur:2200});save()});

function updateCheckin(t){const left=Math.max(0,ciDue+300000-t)/1000;const e=$('#ciT');if(!e)return;e.textContent=`${Math.floor(left/60)}:${pad(Math.floor(left%60))}`;$('#ciP').style.strokeDashoffset=(276.5*(1-left/300)).toFixed(1)}
function closeCheckin(){ciOpen=false;$('#checkin').classList.remove('show')}

/* ================= End of day ================= */
function rollPenalty(label){const t=rollTier(S.settings.penalty.tiers);return{label,tier:t.name,amount:Math.round(rollAmt(t))}}
function rollover(){
 const c=dayKeyOf(now());
 if(!S.dayKey){S.dayKey=c;ensureDay(c);return}
 if(S.dayKey===c)return;
 if(S.dayKey>c){S.dayKey=c;ensureDay(c);return}
 const pk=S.dayKey,d=ensureDay(pk),P=S.settings.penalty;
 const open=S.tasks.filter(t=>!t.doneAt);
 const fprev=d.focus+(S.session?Math.max(0,(Math.min(now(),dayEnd(pk))-Math.max(S.session.start,dayStart(pk)))/1000):0);
 const rep={day:pk,done:S.tasks.length-open.length,total:S.tasks.length,earned:d.earned,focus:fprev,pens:[],perfect:d.perfect,streakBefore:S.streak.count,gap:0,rec:!!d.rec,prevBest:bestDay()};
 if(P.enabled){open.forEach(t=>rep.pens.push(rollPenalty(t.title)));if(P.noFocus&&fprev<60)rep.pens.push(rollPenalty('No focus that day'))}
 if(fprev>bestDay()){S.stats.bestDay=fprev;S.stats.bestDayKey=pk}
 d.list=S.tasks.map(t=>({title:t.title,typeId:t.typeId,done:!!t.doneAt,reward:t.reward||0,level:t.level||''}));
 let gap=0,k=addDays(pk,1);const overdue=[],cap=Math.max(0,num(P.missedCap));
 while(k<c&&gap<60){gap++;const rs=S.routines.filter(r=>routineOn(r,k)),pl=S.plan[k]||[],dd=ensureDay(k);
  dd.list=[...rs.map(r=>({title:r.title,typeId:r.typeId,done:false,reward:0})),...pl.map(t=>({title:t.title,typeId:t.typeId,done:false,reward:0}))];dd.total=dd.list.length;dd.done=0;
  if(P.enabled&&gap<=cap)rs.forEach(r=>rep.pens.push(rollPenalty(`${r.title} · ${shortDate(k)}`)));
  pl.forEach(t=>overdue.push(t));delete S.plan[k];k=addDays(k,1)}
 rep.gap=gap;
 if(!S.settings.carryOver&&P.enabled)overdue.forEach(t=>rep.pens.push(rollPenalty(`${t.title} · missed`)));
 rep.penTotal=rep.pens.reduce((s,p)=>s+p.amount,0);
 rep.pens.forEach(p=>{if(p.amount>0)credit(-p.amount,{kind:'penalty',label:p.label,tier:p.tier,level:'penalty',ts:dayEnd(pk)-1000,day:pk});else S.ledger.unshift({id:uid(),ts:dayEnd(pk)-1000,kind:'penalty',label:p.label,amount:0,tier:p.tier,level:'safe'})});
 d.done=rep.done;d.total=rep.total;d.nw=S.balance;
 if(gap>0||(!d.perfect&&(P.resetStreak||rep.total===0)))S.streak.count=0;
 rep.streakAfter=S.streak.count;
 const keep=S.settings.carryOver?open.filter(t=>!t.routineId).map(t=>({id:t.id,title:t.title,typeId:t.typeId,doneAt:null,reward:null,createdAt:t.createdAt,carried:true,planned:t.planned})):[];
 const od=S.settings.carryOver?overdue.map(t=>({id:t.id,title:t.title,typeId:t.typeId,doneAt:null,reward:null,createdAt:t.createdAt,carried:true,planned:true})):[];
 const fresh=S.routines.filter(r=>routineOn(r,c)).map(instOf);
 const planned=(S.plan[c]||[]).map(t=>({id:t.id,title:t.title,typeId:t.typeId,doneAt:null,reward:null,createdAt:t.createdAt,planned:true}));delete S.plan[c];
 Object.keys(S.plan).forEach(x=>{if(x<c)delete S.plan[x]});
 S.tasks=[...fresh,...planned,...od,...keep];
 S.dayKey=c;ensureDay(c);syncDay();
 if(selKey&&selKey<c)selKey=c;
 if(rep.total||rep.earned||rep.focus>60||rep.pens.length)S.pendingReport=rep;
 saveNow();
}
function showReport(r){return new Promise(res=>{
 const el=$('#report'),dd=keyDate(r.day),net=r.earned-r.penTotal;
 const st=r.perfect?{c:'kept',i:'flame',t:`Streak kept · <b>${r.streakAfter} day${r.streakAfter===1?'':'s'}</b>`}:r.streakBefore>0&&r.streakAfter===0?{c:'lost',i:'flame',t:`Your ${r.streakBefore}-day streak ended. Finish every task today to start a new one.`}:{c:'',i:'target',t:'Finish every task today to start a streak.'};
 const todayN=S.tasks.length;
 el.innerHTML=`<div class="rp"><div class="rp-k" style="animation-delay:.05s">Day closed</div><div class="rp-d" style="animation-delay:.1s">${DAYS[dd.getDay()]}, ${MON[dd.getMonth()]} ${dd.getDate()}</div>
 <div class="rp-sum" style="animation-delay:.16s"><div><span>Tasks</span><b>${r.done}/${r.total}</b></div><div><span>Earned</span><b style="color:var(--pos)">${money(r.earned,{compact:true})}</b></div><div><span>Focus</span><b>${dur(r.focus,true)}</b></div></div>
 ${r.rec?`<div class="rp-rec" style="animation-delay:.2s">${ic('trophy')}<div>New personal best · <b>${dur(r.focus)}</b> focused</div></div>`:''}

 <div class="rp-sec" style="animation-delay:.26s">Penalties</div>
 <div class="rp-pens" style="animation-delay:.3s">${r.pens.length?r.pens.map((p,i)=>`<div class="rp-pen lv-${p.amount?'penalty':'safe'}" data-i="${i}"><div class="rp-pl"><div>${esc(p.label)}</div><span class="rp-tier">${esc(p.tier)}</span></div><div class="rp-amt amt-roll">${p.amount?digitsHTML('−'+money(p.amount)):'<span class="nd">Avoided</span>'}</div></div>`).join(''):`<div class="rp-clean">${ic('check')}Nothing to pay. Clean day.</div>`}</div>
 <div class="rp-tot"><span>Net for the day</span><b class="${net>=0?'up':'down'}">${money(net,{sign:true})}</b></div>
 <div class="rp-st ${st.c}">${ic(st.i)}<div>${st.t}</div></div>

 el.scrollTop=0;el.classList.add('show');

  setTimeout(()=>{spin(r0,850);let t=0;const ti=setInterval(()=>{if(++t*70>750){clearInterval(ti);return}Snd.tick()},70)},60);
  setTimeout(()=>{r0.classList.add('landed');const pen=r0.classList.contains('lv-penalty');pen?Snd.penalty():Snd.safe();haptic(pen?[40,30,40]:15)},960);
  setTimeout(nextRow,rows.length>6?700:1100)};
 const fin=()=>{$('.rp-tot',el).classList.add('in');setTimeout(()=>{$('.rp-st',el).classList.add('in');if(r.perfect)Snd.milestone()},300);setTimeout(()=>$('#rpGo').classList.add('in'),600)};
 setTimeout(nextRow,650);
 let done=false;$('#rpGo').addEventListener('click',()=>{if(done)return;done=true;el.classList.remove('show');S.pendingReport=null;saveNow();setTimeout(()=>{sparkDrawn=false;renderAll();res();if(!S.tasks.length)openTaskSheet()},380)});
})}

/* ================= Settings ================= */
const get=p=>p.split('.').reduce((o,k)=>o&&o[k],S);
function setp(p,v){const ks=p.split('.'),l=ks.pop();ks.reduce((o,k)=>o[k],S)[l]=v}
const R={
 num:(l,p,{pre='',suf='',step=1,hint='',dis=false}={})=>`<label class="srow"><div class="sl"><span>${l}</span>${hint?`<div class="hint2">${hint}</div>`:''}</div><div class="sin">${pre}<input type="number" inputmode="decimal" step="${step}" min="0" data-k="${p}" data-t="num" value="${esc(get(p))}" ${dis?'disabled':''}>${suf}</div></label>`,
 bool:(l,p,hint='')=>`<label class="srow"><div class="sl"><span>${l}</span>${hint?`<div class="hint2">${hint}</div>`:''}</div><span class="switch"><input type="checkbox" data-k="${p}" data-t="bool" ${get(p)?'checked':''}><i></i></span></label>`,
 text:(l,p)=>`<label class="srow"><div class="sl"><span>${l}</span></div><input class="stext" data-k="${p}" data-t="str" value="${esc(get(p))}" maxlength="24"></label>`,
 sel:(l,p,opts)=>`<label class="srow"><div class="sl"><span>${l}</span></div><select class="ssel" data-k="${p}" data-t="num">${opts.map(o=>`<option value="${o[0]}" ${+get(p)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>`,
 range:(l,p)=>`<label class="srow"><div class="sl"><span>${l}</span></div><input type="range" min="0" max="100" step="1" data-k="${p}" data-t="range" value="${num(get(p))}" style="--v:${num(get(p))}%"></label>`,
 link:(l,act,v='',icn='')=>`<button class="srow" data-act="${act}">${icn?`<span class="si">${ic(icn)}</span>`:''}<div class="sl"><span>${l}</span></div><div class="sv">${v}${ic('chev')}</div></button>`
};
const grp=(t,body,note='')=>`<div class="sgroup">${t?`<div class="sg-t">${t}</div>`:''}<div class="sg-b">${body}</div>${note?`<div class="sg-n">${note}</div>`:''}</div>`;
const MINS={'settings.store.luckyPct':0,'settings.store.t.0':1,'settings.store.t.1':1,'settings.store.t.2':1,'settings.store.t.3':1,'settings.focus.maxMult':1,'settings.focus.rampMin':1,'settings.focus.dropEvery':1,'settings.focus.rate':1,'settings.focus.checkInEvery':5,'settings.goals.horizon':.25,'settings.badges.difficulty':.1};
const MAXS={'settings.store.luckyPct':100,'settings.doubleChance':100,'settings.badges.difficulty':10,'settings.goals.horizon':60,'settings.focus.maxMult':20};
function bindInputs(el,after){
 const apply=(i,live)=>{const k=i.dataset.k;if(!k)return;const tp=i.dataset.t;let v=tp==='bool'?i.checked:(tp==='num'||tp==='range')?parseFloat(i.value):i.value;
  if((tp==='num'||tp==='range')&&!isFinite(v)){if(!live)i.value=get(k);return}
  if(tp==='num'){v=Math.max(MINS[k]||0,v);if(MAXS[k])v=Math.min(MAXS[k],v)}
  if(k==='profile.name')v=String(v).trim().slice(0,24)||'there';
  if(tp==='num'&&String(i.value)!==String(v))i.value=v;if(tp==='range')i.style.setProperty('--v',v+'%');
  setp(k,v);save();if(!live){haptic(6);tp==='bool'&&Snd.toggle(v)}
  if(k==='settings.volume')Snd.vol();if(k==='settings.ambVolume')Snd.ambVol();
  if(k==='settings.dayEndHour'){rollover();heroOdo=null;$('#hAmt').innerHTML=''}
  if(k.startsWith('settings.badges'))checkProgress();
  if(!live){after&&after(k,v);renderAll()}};
 el.addEventListener('change',e=>apply(e.target,false));
 el.addEventListener('input',e=>{if(e.target.dataset.t==='range')apply(e.target,true)});
}
function subSheet(title,body,{sub='',onClose,bind}={}){

 bindInputs(sh.sheet,bind);sh.sheet.addEventListener('click',e=>{if(e.target.closest('[data-x="close"]'))sh.close()});return sh;
}
function openSettings(){
 const html=()=>{const s=S.settings,th=THEMES[s.theme]||THEMES.azure;return `<div class="sh-head"><h3>Settings</h3>${closeBtn}</div>
 ${grp('General',R.link('Profile & look','profile',`${esc(S.profile.name||'')} · ${th.n}`,'user'))}
 ${grp('Rewards',R.link('Task types & payouts','types',`${s.types.length} types`,'tag')+R.link('Focus pay & bonuses','focus',`${kshort(num(s.focus.rate))}/h`,'bolt')+R.link('Goals & badges','goals','','trophy')+R.link('Ranks','ranks',`${s.ranks.length} ranks`,'medal')+R.link('Payout boosts','boosts',`${num(s.doubleChance)}% double`,'spark'))}

/* ---- Photos live in IndexedDB so the main save stays small ---- */
const IMG={urls:new Map(),keep:null,warned:false,dbp:null};
const isUrl=r=>/^(https?:|data:|blob:)/i.test(r||'');
function idb(){return IMG.dbp||(IMG.dbp=new Promise((res,rej)=>{try{const q=indexedDB.open('accrue-img',1);q.onupgradeneeded=()=>q.result.createObjectStore('b');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);q.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}}))}
const idbGet=k=>idb().then(db=>new Promise((res,rej)=>{const q=db.transaction('b').objectStore('b').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
const idbPut=(k,v)=>idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('b','readwrite');tx.objectStore('b').put(v,k);tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error)}));
const idbDel=ks=>idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('b','readwrite'),st=tx.objectStore('b');ks.forEach(k=>st.delete(k));tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error)}));
const idbKeys=()=>idb().then(db=>new Promise((res,rej)=>{const q=db.transaction('b').objectStore('b').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
function imgSrc(ref,thumb){if(!ref)return'';if(isUrl(ref))return ref;return (thumb&&IMG.urls.get(ref+'.t'))||IMG.urls.get(ref)||''}
const imgTag=(ref,thumb)=>{if(!ref)return'';const u=imgSrc(ref,thumb);return `<img data-ref="${esc(ref)}" data-th="${thumb?1:0}" ${u?`src="${esc(u)}" `:''}alt="" draggable="false" decoding="async">`};
const ph=name=>`<div class="ph"><span>${esc((String(name||'?').trim().charAt(0)||'?').toUpperCase())}</span></div>`;
const pic=(ref,name,thumb)=>ref?imgTag(ref,thumb):ph(name);
function hydrateImgs(root=document){$$('img[data-ref]',root).forEach(i=>{if(!i.getAttribute('src')){const u=imgSrc(i.dataset.ref,i.dataset.th==='1');if(u)i.src=u}})}
async function imgLoad(refs){
 const need=[...new Set(refs.filter(r=>r&&!isUrl(r)&&!IMG.urls.has(r)))];
 await Promise.all(need.map(async r=>{try{const b=await idbGet(r);if(b)IMG.urls.set(r,URL.createObjectURL(b));const t=await idbGet(r+'.t');if(t)IMG.urls.set(r+'.t',URL.createObjectURL(t))}catch(e){}}));
}
function allRefs(){const s=new Set(IMG.keep||[]);S.store.items.forEach(i=>i.imgs.forEach(r=>s.add(r)));S.vault.forEach(v=>v.imgs.forEach(r=>s.add(r)));S.buys.forEach(b=>{if(b.img)s.add(b.img)});return s}
/* Clears photos nothing uses any more. Saved copies (keys starting with _) are never touched. */
async function gcImgs(){try{const used=allRefs(),keys=await idbKeys(),dead=keys.filter(k=>{k=String(k);return k.charAt(0)!=='_'&&!used.has(k.replace(/\.t$/,''))});if(dead.length){await idbDel(dead);dead.forEach(k=>{const u=IMG.urls.get(k);if(u)URL.revokeObjectURL(u);IMG.urls.delete(k)})}}catch(e){}}
async function procImage(file){
 let bm;try{bm=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bm=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('bad image'));im.src=URL.createObjectURL(file)})}
 const w=bm.width||bm.naturalWidth,h=bm.height||bm.naturalHeight;if(!w||!h)throw new Error('empty image');
 const mk=(max,q)=>{const k=Math.min(1,max/Math.max(w,h)),cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k)),c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#111113';x.fillRect(0,0,cw,ch);x.imageSmoothingQuality='high';x.drawImage(bm,0,0,cw,ch);
  return new Promise(r=>c.toBlob(b=>{if(b&&b.type==='image/webp')r(b);else c.toBlob(b2=>r(b2),'image/jpeg',q)},'image/webp',q))};
 const full=await mk(1400,.86),thumb=await mk(520,.8);if(bm.close)bm.close();
 return{full,thumb};
}

const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
function dataToBlob(u){const i=u.indexOf(','),m=/data:([^;,]+)/.exec(u.slice(0,i)),bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:m?m[1]:'image/webp'})}

/* ---- Prices: daily deal, saving for, lucky receipts ---- */
const DEAL_ODDS=[[10,50],[15,27],[20,15],[30,6],[50,2]];
const dealPrice=(p,pct)=>Math.max(1,Math.round(p*(1-pct/100)));
function leftStr(){const s=Math.max(0,(dayEnd(S.dayKey)-now())/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${Math.max(1,m)}m`}
/* One item is discounted each day. The pick is stored so it never changes during the day. */
function dealToday(){
 if(!S.settings.store.deals||!S.dayKey||!S.onboarded)return null;
 let d=S.store.deal;
 if(!d||d.day!==S.dayKey){
  const av=shopItems();if(!av.length)return null;
  const bal=Math.max(1,S.balance),w=av.map(it=>(it.kind==='once'?2:1)*(it.price<=bal*2?2:1)*(S.store.target===it.id?2:1));
  let r=Math.random()*w.reduce((a,b)=>a+b,0),pick=av[av.length-1];for(let i=0;i<av.length;i++){r-=w[i];if(r<0){pick=av[i];break}}
  let q=Math.random()*100,pct=10;for(const [p,c] of DEAL_ODDS){q-=c;if(q<0){pct=p;break}}
  d=S.store.deal={day:S.dayKey,iid:pick.id,pct,used:false,seen:false,noted:false};save();
 }
 const it=S.store.items.find(x=>x.id===d.iid);
 if(!it||(!d.used&&it.kind==='once'&&ownedOnce(it.id)))return null;
 return{d,it,price:dealPrice(it.price,d.pct)};
}

const LUCK=[[5,60,'rare'],[10,27,'epic'],[25,10,'legendary'],[50,3,'legendary']];
function rollLuck(total){const s=S.settings.store;if(!s.lucky||!(Math.random()*100<num(s.luckyPct)))return null;let q=Math.random()*100;for(const [pct,p,lv] of LUCK){q-=p;if(q<0)return{pct,lv,amt:Math.max(1,Math.round(total*pct/100))}}return{pct:5,lv:'rare',amt:Math.max(1,Math.round(total*.05))}}

/* ---- Buying ---- */
function buyItem(it,qty=1){
 qty=it.kind==='once'?1:clamp(Math.round(qty)||1,1,99);
 if(it.kind==='once'&&ownedOnce(it.id))return null;
 const dl=dealFor(it),unit=dl?dl.price:it.price,total=r2(unit*qty),full=r2(it.price*qty);
 if(!(total>0)||total>S.balance+1e-9)return null;
 const ts=now(),d=ensureDay(dayKeyOf(ts)),st=S.stats;
 S.balance=r2(S.balance-total);S.spent=r2((S.spent||0)+total);d.spent=r2((d.spent||0)+total);
 st.buys=(st.buys||0)+1;if(it.kind==='multi')st.units=(st.units||0)+qty;st.maxBuy=Math.max(st.maxBuy||0,total);
 if(dl){dl.d.used=true;st.deals=(st.deals||0)+1}
 const luck=rollLuck(total);
 const buy={id:uid(),iid:it.id,name:it.name,unit,qty,total,ts,kind:it.kind,cat:it.cat,img:it.imgs[0]||'',deal:dl?dl.d.pct:0,save:dl?r2(full-total):0,back:luck?luck.amt:0};
 S.buys.unshift(buy);if(S.buys.length>3000)S.buys.length=3000;
 let v=null;
 if(it.kind==='once'){v={id:uid(),iid:it.id,pid:buy.id,name:it.name,price:it.price,paid:total,desc:it.desc,cat:it.cat,imgs:it.imgs.slice(),ts};S.vault.push(v);if(S.store.target===it.id){S.store.target=null;S.store.tms=0}}
 S.ledger.unshift({id:uid(),ts,kind:'store',label:qty>1?`${it.name} ×${qty}`:it.name,amount:-total,tier:dl?`Deal ${dl.d.pct}% off`:'',level:''});
 if(luck){S.balance=r2(S.balance+luck.amt);st.cashback=r2((st.cashback||0)+luck.amt);st.lucky=(st.lucky||0)+1;
  S.ledger.unshift({id:uid(),ts:ts+1,kind:'cashback',label:`${luckName(luck)} · ${it.name}`,amount:luck.amt,tier:`${luck.pct}% back`,level:luck.lv})}

 d.nw=S.balance;
 saveNow();checkProgress();storeWatch();
 return{buy,v,it,qty,luck,dl:dl?dl.d.pct:0,full,total};
}
/* Alerts when a collectable comes within reach, and as you close in on the item you're saving for */
function storeWatch(silent){

 S.store.items.forEach(it=>{
  if(it.kind!=='once'||ownedOnce(it.id)){delete A[it.id];return}

  if(ok&&!A[it.id]){A[it.id]=1;if(!silent&&(!tg||tg.id!==it.id)&&(!hit||it.price>hit.price))hit=it}
  else if(!ok&&A[it.id])delete A[it.id]});
